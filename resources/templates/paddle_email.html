<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Otp Template For Buyer Registration</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Noto+Sans:wght@300;400;500&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;0,1000;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900;1,1000&family=Roboto:wght@100;400;500&display=swap" rel="stylesheet">
        <style>
            body{
                background: #E6E6E6;
                font-family: 'Inter', sans-serif !important;
            }
            .indy-logo{
                margin: 48px auto 0px;
                text-align: center;
                cursor: pointer;
            }
            .maincontent{
                background: #FFFFFF;
                max-width: 666px;
                height: auto;
                margin: 40px auto;
                border-radius: 10px;
                font-family: 'Inter', sans-serif !important;
                padding-top: 28px;
            }
            .maincontent1{
                max-width: 660px;
                font-family: 'Inter', sans-serif !important;
            }
            .footer-content1 {
                font-size: 12px;
                font-weight: 500px;
                color: #A1A1A9;
                font-family: 'Inter', sans-serif !important;
                margin: 20px auto 50px;
                text-align: center;
            }
            .headersection{
                text-align: center;
                padding: 28px 0px;
                background-color: white;
                border-radius: 6px;
                font-family: 'Inter', sans-serif !important;
            }
            .heading-con, .heading-con1{
                font-size: 18px;
                line-height: normal;
                color: #343434;
                font-style: medium;
                font-weight: 500;
                margin:0px;
                font-family: 'Inter', sans-serif !important;
            }
            .heading-con1{
                font-size: 16px;
            }
            .paragraph{
                font-size: 17px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#343434;
                text-align: center;
                padding:0px 132px;
                font-family: 'Inter', sans-serif !important;
            }
            .note-main{
                margin: 0px !important;
                padding: 0px;
                font-family: 'Inter', sans-serif !important;
            }
            .note-con{
                font-size: 16px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#343434;
                font-family: 'Inter', sans-serif !important;
                margin: 25px 0;
            }
            .paddle-body{
                max-width: 540px;
                margin: 28px auto;
                border-radius: 8px;
                background: {{background_color}};
                padding: 1px;
            }
            .paddle-body p{
                font-size: 91px;
                font-weight: 500;
                line-height: 34px;
                color: #ffffff;
            }
            .otp-con{
                font-size: 22px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                margin:34px 0px 20px;
                font-family: 'Inter', sans-serif !important;
            }
            .validcode{
                font-size: 18px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#A1A1A9;
                margin-bottom: 44px;
                font-family: 'Inter', sans-serif !important;
            }
            .indy-link{
                font-size: 14px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                text-decoration-line: underline;
                color:#343434 !important;
                cursor: pointer;
                font-family: 'Inter', sans-serif !important;
            }
            .footer-con{
                margin:22px auto 0px;
                text-align: center;
                font-family: 'Inter', sans-serif !important;
            }
            .insta-icon{
                margin-right:16px;
                cursor: pointer;
                font-family: 'Inter', sans-serif !important;
            }
            .linkedin-icon{
                cursor: pointer;
            }
            .facebook-icon{
                margin-right:16px;
                cursor: pointer;
            }
            .twitter-icon{
                margin-right:16px;
                cursor: pointer;
            }
            .footer-content{
                font-size: 10px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#A1A1A9;
                font-family: 'Inter', sans-serif !important;
            }
            @media(max-width:575px){
                .headersection{
                    padding: 22px 20px 40px 20px;
                    background-color: white;
                    border-radius: 6px;
                }
                .heading-con{
                    font-size: 20px;
                }
                .paragraph{
                    font-size: 16px;
                    padding: 0px;
                }
                .otp-con{
                    margin:20px;
                    font-size: 20px;
                }
                .validcode{
                    font-size: 16px;
                    margin-bottom: 30px;
                }
                .main-content{
                    margin: 120px auto;
                }
                .note-con{
                    font-size: 14px;
                }
                .paddle-body p{
                    font-size: 50px;
                }
                .indy-logo {
                    margin: 20px auto 0px;
                }
            }
        </style>
    </head>
    <body>
        <div class="maincontent">
            <div class="indy-logo">
                <a href="#"><img src="{{img}}" alt="img" style="width: 180px; height: auto;"></a> 
            </div>
            <div class="headersection">
                <P class="heading-con">Dear {{user_first_name}}, </P>
                <p class="paragraph">Congratulations, you are now registered to bid in the auction:</p>
                <p class="otp-con">{{Auction_title}}</p>
                <p class="validcode">{{auction_start_date}} at {{auction_start_time}}.</p>
                <p class="heading-con1">Your paddle number is attached. It is unique to you <br/> and this auction.</p>
                <div class="paddle-body">
                    <p style="color:{{color}}">{{paddle}}</p>
                </div>
                <div class="note-main">
                    <p class="note-con" style="margin-top: 25px;">All our best,<br/>  {{Seller_name}}</p>
                </div>
            </div>
        </div>
        <div>
            <p class="footer-content1">Powered by Indy.auction</p>
        </div>
    </body>
</html>

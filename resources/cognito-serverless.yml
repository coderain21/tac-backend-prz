      Type: 'AWS::SSM::Parameter'
      Properties:
        Name: STATE_MACHINE_LOT_ARN
        Description: 'ARN of the Hello Step Functions state machine'
        Type: 'String'
        Value: !Sub
          - arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${StateMachineName}
          - StateMachineName: ${opt:stage}-lot-published

    

    AuctionStateMachineSSMParameter:
      Type: 'AWS::SSM::Parameter'
      Properties:
        Name: STATE_MACHINE_AUCTION_ARN
        Description: 'ARN of the Hello Step Functions state machine'
        Type: 'String'
        Value: !Sub
          - arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${StateMachineName}
          - StateMachineName: ${opt:stage}-auction-ended


    messageQueue:
      Type: "AWS::SQS::Queue"
      Properties:
        QueueName: auto-completion-email-${opt:stage, self:provider.stage}.fifo
        FifoQueue: true

    SQSSSMParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: SQS_QUEUE_ARN
        Type: String
        Value: 
          Fn::GetAtt:
            - messageQueue
            - Arn


    SQSURLSSMParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: QUEUE_URL
        Type: 'String'
        Value: !Sub "https://sqs.eu-west-2.amazonaws.com/${AWS::AccountId}/auto-completion-email-${opt:stage}.fifo"

    

    

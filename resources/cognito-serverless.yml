service: cognito-resources
frameworkVersion: "3"
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - states:*
            - dynamodb:*
            - lambda:*
            - cognito-idp:*
            - s3:*
            - execute-api:*
            - ses:*
          Resource: "*"

resources: 
  Resources:
    EmailOtp:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/email_otp.html)}
        Subject: Indy.auction - OTP Verification for Your Account
        TemplateName: ${self:provider.stage}-email-otp-template
    WelcomeEmailTemplate:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/welcome_email_template.html)}
        Subject: Welcome to Indy.auction - Your Auctioneering Partner!
        TemplateName: ${self:provider.stage}-welcome_email_template
    SellerForgotPassword:
      Type: AWS::SES::Template
      Properties: 
        Template:
          HtmlPart: ${file(./templates/seller-forgot-password.html)}
          SubjectPart: Indy auction - Password Reset Request
          TemplateName: ${self:provider.stage}-forgot-password
    AuctionCompletion:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/send-auction-completion-email.html)}
        Subject: "Indy.auction - {{subject}}"
        TemplateName: ${self:provider.stage}-send-auction-completion-email
    BuyerEmailOtp:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/buyer_email_otp.html)}
        Subject: Indy.auction - OTP Verification for Your Account
        TemplateName: ${self:provider.stage}-buyer_email_otp
    BuyerResetPassword:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/buyer_reset_password.html)}
        Subject: Indy.auction- Reset your password
        TemplateName: ${self:provider.stage}-buyer_reset_password
 
    Buyers:
      Type: "AWS::Cognito::UserPool"
      Properties:
        UserPoolName: ${self:provider.stage}-indyauction-buyers
        Policies:
          PasswordPolicy:
            MinimumLength: 6
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            TemporaryPasswordValidityDays: 7
        # DeletionProtection: ACTIVE
        Schema:
          - Name: sub
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: false
            Required: true
            StringAttributeConstraints:
              MinLength: "1"
              MaxLength: "2048"
          - Name: name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: given_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: family_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: middle_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: nickname
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: preferred_username
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: profile
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: picture
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: website
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: true
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email_verified
            AttributeDataType: Boolean
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
          - Name: gender
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: birthdate
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "10"
              MaxLength: "10"
          - Name: zoneinfo
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: locale
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: phone_number
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: address
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: updated_at
            AttributeDataType: Number
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            NumberAttributeConstraints:
              MinValue: "0"
        AliasAttributes:
          - preferred_username
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate: []
        MfaConfiguration: "OFF"
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        UsernameConfiguration:
          CaseSensitive: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Priority: 1
              Name: admin_only
        
    BuyersGoogleAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          preferred_username: "email"
          username: "sub"
          email: "email"
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: ${ssm:GOOGLE_CLIENT_ID}
          client_secret: ${ssm:GOOGLE_CLIENT_SECRET}
          authorize_scopes: "email openid profile"
        UserPoolId: { Ref: Buyers }
          
    
    BuyersFacebookAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          username: "id"
          email: "email"
        ProviderName: Facebook
        ProviderType: Facebook
        ProviderDetails:
          client_id: ${ssm:FACEBOOK_CLIENT_ID}
          client_secret: ${ssm:FACEBOOK_CLIENT_SECRET}
          authorize_scopes: "email openid profile"
        UserPoolId: { Ref: Buyers }
    
    BuyersGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: "buyer"
        UserPoolId: { Ref: Buyers }

    BuyersDomain:
      Type: "AWS::Cognito::UserPoolDomain"
      Properties:
        Domain: buyers-indyauction-${self:provider.stage}
        UserPoolId: { Ref: Buyers }

    BuyersClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: 
        - BuyersGoogleAuth
        - BuyersFacebookAuth
      Properties:
        AccessTokenValidity: 60
        AllowedOAuthFlowsUserPoolClient: true
        AuthSessionValidity: 10
        ClientName: default-client
        UserPoolId: { Ref: Buyers }
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        SupportedIdentityProviders:
          - "COGNITO"
          - "Google"
          - "Facebook"
        AllowedOAuthFlows:
          - implicit
          - code
        AllowedOAuthScopes:
          - openid
          - profile
          - email
          - aws.cognito.signin.user.admin
        CallbackURLs:
          - "${ssm:BASE_URL_BUYER}/"
          - "${ssm:BASE_URL_BUYER}/login"
          - "${ssm:BASE_URL_BUYER}/register"
          - "http://localhost:3000/"
          - "http://localhost:3001/"
          - "http://localhost:3000/login"
          - "http://localhost:3000/register"
        LogoutURLs:
          - "${ssm:BASE_URL_BUYER}/"
          - "${ssm:BASE_URL_BUYER}/login"
          - "${ssm:BASE_URL_BUYER}/register"
          - "http://localhost:3000/"
          - "http://localhost:3001/"
          - "http://localhost:3000/login"
          - "http://localhost:3000/register"
        IdTokenValidity: 60
        PreventUserExistenceErrors: LEGACY
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
        
    BuyersCognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: indyauction-buyers-${self:provider.stage}
        AllowUnauthenticatedIdentities: true
        AllowClassicFlow: true
        CognitoIdentityProviders: 
          - ClientId: !Ref BuyersClient
            ProviderName: !GetAtt Buyers.ProviderName
            ServerSideTokenCheck: false
        # Define more configuration properties as needed

     # Replace with your IAM role
    
    CognitoImageAccessRole: # Define your IAM role here
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Federated: "cognito-identity.amazonaws.com"
              Action: "sts:AssumeRoleWithWebIdentity"
              Condition:
                StringEquals:
                  "cognito-identity.amazonaws.com:aud": 
                    Ref: BuyersCognitoIdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.amazonaws.com:amr": "authenticated"

        Policies:
          - PolicyName: S3AccessPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "s3:*" # Adjust permissions as needed
                    
                  Resource: "arn:aws:s3:::${ssm:BUCKET_NAME}/*" # Replace with your S3 bucket ARN
  
    BuyerCognitoIdentityPoolRole:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId:
          Ref: BuyersCognitoIdentityPool
        Roles:
          authenticated:
            Fn::GetAtt: [CognitoImageAccessRole, Arn]
    
    AdminCognitoIdentityPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_IDENTITY_POOL_ID
          Type: String
          Value: { Ref: BuyersCognitoIdentityPool }

    AdminCognitoPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_ID
          Type: String
          Value: { Ref: Buyers }

    AdminCognitoPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_NAME
          Type: String
          Value: indyauction-buyers-${self:provider.stage}
    
    AdminCognitoClientIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_CLIENT_ID
          Type: String
          Value: { Ref: BuyersClient }
    
    AdminCognitoPoolARNStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_AUTH_ARN
          Type: String
          Value:
            Fn::GetAtt:
              - Buyers
              - Arn
    
    BuyersDomainStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_DOMAIN
          Type: String
          Value: buyers-indyauction-${self:provider.stage}.auth.eu-west-2.amazoncognito.com

    BuyersCognitoIdentityPoolNameStore:
        Type: AWS::SSM::Parameter

service: cognito-auth
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs14.x
  stage: ${opt:stage, 'dev'}
  region: me-south-1
  environment:
    STAGE: ${self:provider.stage}
    TABLE_NAME: prod-${self:service}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    SENDER_EMAIL: ${env:SENDER_EMAIL}
    SELLER_OTP_TEMPLATE: seller-user-account-login
   

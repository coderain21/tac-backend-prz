service: cognito
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  layers: ${ssm:COMMON_LIB_ARN}
  http:
    cors: true
     

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
            - dynamodb:*
            - execute-api:*
          Resource: "*"
  

  environment:
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
  

    
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  

functions: 
  pre-auth:
    handler: handlers/pre_signup.handler
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    layers:
      
      - ${ssm:COMMON_LIB_ARN}
    # events:
    #   - cognitoUserPool:
    #       pool: indyauction-buyers-${self:provider.stage}
    #       trigger: PreSignUp
    #       existing: true
    # events:
    #   - cognitoUserPool:
    #       pool: ${ssm:BUYER_COGNITO_USERPOOL_NAME}
    #       trigger: PreSignUp
    #       existing: true


resources:
   Resources:
    Buyers:
      Type: "AWS::Cognito::UserPool"
      Properties:
        UserPoolName: ${self:provider.stage}-indyauction-buyers
        Policies:
          PasswordPolicy:
            MinimumLength: 6
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            TemporaryPasswordValidityDays: 7
        # DeletionProtection: ACTIVE
        Schema:
          - Name: sub
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: false
            Required: true
            StringAttributeConstraints:
              MinLength: "1"
              MaxLength: "2048"
          - Name: name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: given_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: family_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: middle_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: nickname
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: preferred_username
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: profile
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: picture
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: website
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: true
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email_verified
            AttributeDataType: Boolean
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
          - Name: gender
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: birthdate
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "10"
              MaxLength: "10"
          - Name: zoneinfo
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: locale
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: phone_number
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          # - Name: phonenumber_verified
          #   AttributeDataType: Boolean
          #   DeveloperOnlyAttribute: false
          #   Mutable: true
          #   Required: false
          - Name: address
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: updated_at
            AttributeDataType: Number
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            NumberAttributeConstraints:
              MinValue: "0"
          # - Name: identities
          #   AttributeDataType: String
          #   DeveloperOnlyAttribute: false
          #   Mutable: true
          #   Required: false
          #   StringAttributeConstraints:
          #     MaxLength: "2048"
        AliasAttributes:
          - preferred_username
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate: []
        MfaConfiguration: "OFF"
        # EnabledMfas:
        #   - SOFTWARE_TOKEN_MFA
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        UsernameConfiguration:
          CaseSensitive: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Priority: 1
              Name: admin_only
        
    
    
    
    GoogleAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          preferred_username: "email"
          username: "sub"
          email: "email"
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: ${env:GOOGLE_CLIENT_ID}
          client_secret: ${env:GOOGLE_CLIENT_SECRET}
          authorize_scopes: "email openid profile"
        UserPoolId: { Ref: Buyers }
          
    
    FacebookAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          preferred_username: "email"
          username: "id"
          email: "email"
        ProviderName: Facebook
        ProviderType: Facebook
        ProviderDetails:
          client_id: ${env:FACEBOOK_CLIENT_ID}
          client_secret: ${env:FACEBOOK_CLIENT_SECRET}
          authorize_scopes: "email openid profile"
        UserPoolId: { Ref: Buyers }
    
    
    
    BuyersDomain:
      Type: "AWS::Cognito::UserPoolDomain"
      Properties:
        Domain: buyers-indyauction-${self:provider.stage}
        UserPoolId: { Ref: Buyers }

    BuyersClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        AccessTokenValidity: 60
        AllowedOAuthFlowsUserPoolClient: true
        AuthSessionValidity: 10
        ClientName: default-client
        UserPoolId: { Ref: Buyers }
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
        SupportedIdentityProviders:
          - "COGNITO"
          - "Google"
          - "Facebook"
        AllowedOAuthFlows:
          - implicit
          - code
        AllowedOAuthScopes:
          - openid
          - profile
          - email
          - aws.cognito.signin.user.admin
        CallbackURLs:
          - "https://www-${opt:stage}.indyauction.net/"
          - "https://www-${opt:stage}.indyauction.net/login"
          - "https://www-${opt:stage}.indyauction.net/register"
          - "http://localhost:3000/"
          - "http://localhost:3001/"
          - "http://localhost:3000/login"
          - "http://localhost:3000/register"
        LogoutURLs:
          - "https://www-${opt:stage}.indyauction.net/"
          - "https://www-${opt:stage}.indyauction.net/login"
          - "https://www-${opt:stage}.indyauction.net/register"
          - "http://localhost:3000/"
          - "http://localhost:3001/"
          - "http://localhost:3000/login"
          - "http://localhost:3000/register"
        IdTokenValidity: 60
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
        

    
    CognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: indyauction-buyers-${self:provider.stage}
        AllowUnauthenticatedIdentities: true
        AllowClassicFlow: true
        CognitoIdentityProviders: 
          - ClientId: !Ref BuyersClient
            ProviderName: !GetAtt Buyers.ProviderName
            ServerSideTokenCheck: false
        # Define more configuration properties as needed

     # Replace with your IAM role
    
    MyRoleLogicalName: # Define your IAM role here
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Federated: "cognito-identity.amazonaws.com"
              Action: "sts:AssumeRoleWithWebIdentity"
              Condition:
                StringEquals:
                  "cognito-identity.amazonaws.com:aud": 
                    Ref: CognitoIdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.amazonaws.com:amr": "authenticated"

        Policies:
          - PolicyName: S3AccessPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "s3:*" # Adjust permissions as needed
                    
                  Resource: "arn:aws:s3:::${ssm:BUCKET_NAME}" # Replace with your S3 bucket ARN
  
    CognitoIdentityPoolRole:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId:
          Ref: CognitoIdentityPool
        Roles:
          authenticated:
            Fn::GetAtt: [MyRoleLogicalName, Arn]
    AdminCognitoIdentityPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_IDENTITY_POOL_ID
          Type: String
          Value: { Ref: CognitoIdentityPool }

    AdminCognitoPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_ID
          Type: String
          Value: { Ref: Buyers }

    AdminCognitoPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_NAME
          Type: String
          Value: indyauction-buyers-${self:provider.stage}
    AdminCognitoClientIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_CLIENT_ID
          Type: String
          Value: { Ref: BuyersClient }
    
    AdminCognitoPoolARNStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_AUTH_ARN
          Type: String
          Value:
            Fn::GetAtt:
              - Buyers
              - Arn
    
    BuyersDomainStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_DOMAIN
          Type: String
          Value: buyers-indyauction-${self:provider.stage}

    BuyersCognitoIdentityPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_IDENTITY_POOL_NAME
          Type: String
          Value: indyauction-buyers-${self:provider.stage}

            
plugins:
  - serverless-offline
  - serverless-package-external
  # - serverless-domain-manager
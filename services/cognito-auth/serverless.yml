service: cognito
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  layers:  ${ssm:NodeLayerARN}
  apiGateway:
    methodSettings:
      - metricsEnabled: true
        loggingLevel: INFO
        dataTraceEnabled: false
        resourcePath: "/*"
        httpMethod: "*"  
  environment:
    BUYER_RECAPTCHA_URL: https://www.google.com/recaptcha/api/siteverify
    RECAPTCHA_KEY: ${ssm:RECAPTCHA_KEY}
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    BUYER_WISHLIST_TABLE_NAME: ${opt:stage, self:provider.stage}-buyer-wishlists
    REGION: ${env:REGION}
    ADMIN_COGNITO_CLIENT_ID: { Ref: AdminUsersClient } 
    STAGE: ${opt:stage, self:provider.stage}
    DATABASE: ${ssm:DATABASE}
    MONGODB_NAME: ${opt:stage, self:provider.stage}
    MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-users
    MONGO_CLIENT: ${self:custom.mongodbConnectionString}
    AUCTION_MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-auctions
    SELLERS_TABLE: ${opt:stage, self:provider.stage}-users
    SUMSUB_SECRET_KEY: ${ssm:SUMSUB_SECRET_KEY}
    SUMSUB_APP_TOKEN: ${ssm:SUMSUB_APP_TOKEN}
    CSV_FILE:  /tmp/Auctions.csv
    S3_BUCKET:  ${ssm:BUCKET_NAME}
    LOT_COLLECTION_NAME: ${opt:stage, self:provider.stage}-lots
    COUNTER_LOT: ${opt:stage, self:provider.stage}-counters
    REGISTER_AUCTION_COLLECTION: ${opt:stage, self:provider.stage}-register-auction
    SUB_DOMAIN_TABLE: ${opt:stage, self:provider.stage}-subdomain
    USERPOOLS_MONGO: ${opt:stage, self:provider.stage}-userpools
    ENCRYPTION_SECRET_KEY: Indy@auction@789
    BUYER_COLLECTION: ${opt:stage, self:provider.stage}-buyers
    RECAPTCHA_URL: https://www.google.com/recaptcha/api/siteverify
    CUSTOMER_SESSION_TOKEN_SECRET: ${ssm:CUSTOMER_SESSION_TOKEN_SECRET}
    SES_SENDER_EMAIL_ID: ${ssm:SENDER_EMAIL_ADDRESS}
    DEFAULT_SUB_DOMAIN: ${ssm:DEFAULT_SUB_DOMAIN}
    JWT_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    BASE_URL_BUYER: ${ssm:BASE_URL_BUYER}
    CDN_LINK: ${ssm:CDN_URL}
    DEFAULT_USERPOOL_ID: { Ref: Buyers }
    DEFAULT_COGNITO_DOMAIN: buyers-indyauction-${self:provider.stage}
    STRIPE_API_KEY: ${ssm:STRIPE_API_KEY}
    SELLER_GOOGLE_PASSWORD: INDY@SELLER
    PASSWORD_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    CREDIT_CARD_COLLECTIONS: ${opt:stage, self:provider.stage}-credit-card
    ACCESS_LOG_COLLECTION: ${opt:stage, self:provider.stage}-access-logs

    TEMPLATE_ARN_EMAIL_OTP: 
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-email-otp-template/EMAIL"
    TEMPLATE_ARN_WELCOME_EMAIL: 
       Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-welcome_email_template/EMAIL"
    REDIS_CLUSTER_ENDPOINT: ${ssm:REDIS_CLUSTER_ENDPOINT}
    BUYER_COGNITO_USERPOOL_ID: { Ref: Buyers }
    BUYER_COGNITO_CLIENT_ID: { Ref: BuyersClient } 
  http:
    cors: true
     

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
            - dynamodb:*
            - execute-api:*
          Resource: "*"
  

  

    
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  isProd: ${self:provider.stage} # Will be resolved at deploy time
  mongodbConnectionString: ${file(../env.yml):${self:provider.stage}.MONGODB_CONNECTION_STRING}
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
functions: 
  pre-auth:
    handler: handlers/pre_signup.handler
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - cognitoUserPool:
          pool: ${self:provider.stage}-indyauction-buyers
          trigger: PreSignUp
          existing: true

  post-auth:
    handler: handlers/post_auth.handler
    layers:
      -  ${ssm:NodeLayerARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - cognitoUserPool:
          pool: ${self:provider.stage}-indyauction-buyers
          trigger: PostAuthentication
          existing: true

  # COGNITO CREATE AUTH CHALLENGE
  cognito-create-auth-challenge:
    handler: handlers/cognito_create_auth_challenge.handler
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - cognitoUserPool:
          pool: ${opt:stage, self:provider.stage}-indyauction-admin
          trigger: CreateAuthChallenge
          existing: true
  
  # COGNITO DEFINE AUTH CHALLENGE
  cognito-define-auth-challenge:
    handler: handlers/cognito_define_auth_challenge.handler
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - cognitoUserPool:
          pool: ${opt:stage, self:provider.stage}-indyauction-admin
          trigger: DefineAuthChallenge
          existing: true

  # COGNITO VERIFY AUTH CHALLENGE
  cognito-verify-auth-challenge:
    handler: handlers/cognito_verify_auth_challenge.handler
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - cognitoUserPool:
          pool: ${opt:stage, self:provider.stage}-indyauction-admin
          trigger: VerifyAuthChallengeResponse
          existing: true
    
  add_callback_logout_urls:
    handler: handlers/add_callback_logout_urls.add_callback_logout_urls
    runtime: python3.9
    layers:
      -  ${ssm:PythonLayerARN}
    vpc:
      securityGroupIds:
      - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
      - ${ssm:SUBNET_ID}

  admin-pre-signup:
    handler: handlers/admin_pre_signup.handler
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - cognitoUserPool:
          pool: ${self:provider.stage}-indyauction-admin
          trigger: PreSignUp
          existing: true

  

resources:
  Conditions:
    IsProd:
      Fn::Equals:
        - ${self:custom.isProd}
        - prod
  Resources:
    Buyers:
      Type: "AWS::Cognito::UserPool"
      Properties:
        UserPoolName: ${self:provider.stage}-indyauction-buyers
        Policies:
          PasswordPolicy:
            MinimumLength: 6
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            TemporaryPasswordValidityDays: 7
        # DeletionProtection: ACTIVE
        Schema:
          - Name: sub
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: false
            Required: true
            StringAttributeConstraints:
              MinLength: "1"
              MaxLength: "2048"
          - Name: name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: given_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: family_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: middle_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: nickname
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: preferred_username
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: profile
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: picture
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: website
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: true
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email_verified
            AttributeDataType: Boolean
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
          - Name: gender
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: birthdate
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "10"
              MaxLength: "10"
          - Name: zoneinfo
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: locale
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: phone_number
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          # - Name: phonenumber_verified
          #   AttributeDataType: Boolean
          #   DeveloperOnlyAttribute: false
          #   Mutable: true
          #   Required: false
          - Name: address
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: updated_at
            AttributeDataType: Number
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            NumberAttributeConstraints:
              MinValue: "0"
          # - Name: identities
          #   AttributeDataType: String
          #   DeveloperOnlyAttribute: false
          #   Mutable: true
          #   Required: false
          #   StringAttributeConstraints:
          #     MaxLength: "2048"
        AliasAttributes:
          - preferred_username
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate: []
        MfaConfiguration: "OFF"
        # EnabledMfas:
        #   - SOFTWARE_TOKEN_MFA
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        UsernameConfiguration:
          CaseSensitive: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Priority: 1
              Name: admin_only
        
    GoogleAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          preferred_username: "email"
          username: "sub"
          email: "email"
          given_name: "given_name"
          family_name: "family_name"
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: ${ssm:GOOGLE_CLIENT_ID}
          client_secret: ${ssm:GOOGLE_CLIENT_SECRET}
          authorize_scopes: "email openid profile"
        UserPoolId: { Ref: Buyers }
          
    FacebookAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          username: "id"
          email: "email"
          given_name: "first_name"
          family_name: "last_name"
        ProviderName: Facebook
        ProviderType: Facebook
        ProviderDetails:
          client_id: ${ssm:FACEBOOK_CLIENT_ID}
          client_secret: ${ssm:FACEBOOK_CLIENT_SECRET}
          authorize_scopes: "email"
        UserPoolId: { Ref: Buyers }
    
    Group:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: "buyer"
        UserPoolId: { Ref: Buyers }

    BuyersClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn:
        - GoogleAuth
        - FacebookAuth
      Properties:
        AccessTokenValidity: 60
        AllowedOAuthFlowsUserPoolClient: false
        AuthSessionValidity: 3
        ClientName: default-client
        UserPoolId: !Ref Buyers
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        SupportedIdentityProviders:
          - COGNITO
          - Google
          - Facebook
        # AllowedOAuthFlows:
        #   - implicit
        #   - code
        # AllowedOAuthScopes:
          # - openid
          # - profile
          # - email
          # - aws.cognito.signin.user.admin
        IdTokenValidity: 60
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days

    CognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: indyauction-buyers-${self:provider.stage}
        AllowUnauthenticatedIdentities: true
        AllowClassicFlow: true
        CognitoIdentityProviders: 
          - ClientId: !Ref BuyersClient
            ProviderName: !GetAtt Buyers.ProviderName
            ServerSideTokenCheck: false
        # Define more configuration properties as needed

     # Replace with your IAM role
    
    MyRoleLogicalName: # Define your IAM role here
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Federated: "cognito-identity.amazonaws.com"
              Action: "sts:AssumeRoleWithWebIdentity"
              Condition:
                StringEquals:
                  "cognito-identity.amazonaws.com:aud": 
                    Ref: CognitoIdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.amazonaws.com:amr": "authenticated"

        Policies:
          - PolicyName: S3AccessPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "s3:PutObject" # Adjust permissions as needed
                    - "s3:GetObject"
                  Resource: "arn:aws:s3:::${ssm:BUCKET_NAME}/*" # Replace with your S3 bucket ARN
  
    CognitoIdentityPoolRole:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId:
          Ref: CognitoIdentityPool
        Roles:
          authenticated:
            Fn::GetAtt: [MyRoleLogicalName, Arn]
    BuyerCognitoIdentityPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_IDENTITY_POOL_ID
          Type: String
          Value: { Ref: CognitoIdentityPool }

    BuyerCognitoPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_ID
          Type: String
          Value: { Ref: Buyers }

    BuyerCognitoPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_USERPOOL_NAME
          Type: String
          Value: indyauction-buyers-${self:provider.stage}
    BuyerCognitoClientIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_CLIENT_ID
          Type: String
          Value: { Ref: BuyersClient }
    
    BuyerCognitoPoolARNStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_AUTH_ARN
          Type: String
          Value:
            Fn::GetAtt:
              - Buyers
              - Arn
    
    BuyersCognitoIdentityPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: BUYER_COGNITO_IDENTITY_POOL_NAME
          Type: String
          Value: indyauction-buyers-${self:provider.stage}
    # BuyersDomainStore:
    #     Type: AWS::SSM::Parameter
    #     Properties:
    #       Name: BUYER_COGNITO_USERPOOL_DOMAIN
    #       Type: String
    #       Value: buyers-indyauction-${self:provider.stage}.auth.eu-west-2.amazoncognito.com



    AdminUsers:
      Type: "AWS::Cognito::UserPool"
      Properties:
        UserPoolName: ${self:provider.stage}-indyauction-admin
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            TemporaryPasswordValidityDays: 7
        Schema:
          - Name: preferred_username
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: true
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email_verified
            AttributeDataType: Boolean
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
        AliasAttributes:
          - preferred_username
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate: []
        MfaConfiguration: "OFF"
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        UsernameConfiguration:
          CaseSensitive: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Priority: 1
              Name: admin_only

    AdminUsersClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        AccessTokenValidity: 5
        AllowedOAuthFlowsUserPoolClient: false
        AuthSessionValidity: 3
        ClientName: admin
        UserPoolId: { Ref: AdminUsers }
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        IdTokenValidity: 5
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days

    AdminCognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: indyauction-admin-${self:provider.stage}
        AllowUnauthenticatedIdentities: true
        AllowClassicFlow: true
        CognitoIdentityProviders: 
          - ClientId: !Ref AdminUsersClient
            ProviderName: !GetAtt AdminUsers.ProviderName
            ServerSideTokenCheck: false
        # Define more configuration properties as needed
    
    AdminCognitoIdentityPoolRole:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId:
          Ref: AdminCognitoIdentityPool
        Roles:
          authenticated:
            Fn::GetAtt: [AdminRoleLogicalName, Arn] # Replace with your IAM role
    
    AdminRoleLogicalName: # Define your IAM role here
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Federated: "cognito-identity.amazonaws.com"
              Action: "sts:AssumeRoleWithWebIdentity"
              Condition:
                StringEquals:
                  "cognito-identity.amazonaws.com:aud": 
                    Ref: AdminCognitoIdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.amazonaws.com:amr": "authenticated"

        Policies:
          - PolicyName: S3AccessPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "s3:PutObject" # Adjust permissions as needed
                    - "s3:GetObject"
                  Resource: "arn:aws:s3:::${ssm:BUCKET_NAME}/*" # Replace with your S3 bucket ARN
  

    AdminCognitoIdentityPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_IDENTITY_POOL_ID
          Type: String
          Value: { Ref: AdminCognitoIdentityPool }

    AdminCognitoPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_USERPOOL_ID
          Type: String
          Value: { Ref: AdminUsers }

    AdminCognitoPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_USERPOOL_NAME
          Type: String
          Value: indyauction-admin-${self:provider.stage}
    AdminCognitoClientIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_CLIENT_ID
          Type: String
          Value: { Ref: AdminUsersClient }
  
    
    AdminCognitoPoolARNStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_AUTH_ARN
          Type: String
          Value:
            Fn::GetAtt:
              - AdminUsers
              - Arn     
    
    BuyerEmailOtp:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/buyer_email_otp.html)}
        Subject: Indy.auction - OTP Verification for Your Account
        TemplateName: ${self:provider.stage}-buyer_email_otp
    BuyerResetPassword:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/buyer_reset_password.html)}
        Subject: Indy.auction- Reset your password
        TemplateName: ${self:provider.stage}-buyer_reset_password
    BuyerLambdaArn:
        Type: AWS::SSM::Parameter
        Properties:
          Name: LAMBDA_ARN
          Type: String
          Value: arn:aws:lambda:${aws:region}:${aws:accountId}:function:cognito-${self:provider.stage}-add_callback_logout_urls
    
    UpdatePassword:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/update_password.html)}
        Subject: Indy.auction - Password Update Confirmation
        TemplateName: ${self:provider.stage}-admin-update-password-template

    ActivateSeller:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/activate_seller.html)}
        Subject: Indy.auction - Your Account Activation Notification
        TemplateName: ${self:provider.stage}-admin-activate-seller-template
    
    DeactivateSeller:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/deactivate_seller.html)}
        Subject: Indy.auction - Your Account Deactivation Notification
        TemplateName: ${self:provider.stage}-admin-deactivate-seller-template

    DeleteBuyer:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/delete_buyer.html)}
        Subject: Indy.auction - Your Account Deactivation Notification
        TemplateName: ${self:provider.stage}-admin-delete-buyer-template
    # WebAclAssociationCognitoBuyer: Only enabled for production stage to provide WAF protection
    # Uses CloudFormation condition 'IsProd' to create resource only for prod stage
    # SSM parameter has default value to prevent resolution errors in non-prod environments
    WebAclAssociationCognitoBuyer:
      Condition: IsProd
      Type: AWS::WAFv2::WebACLAssociation
      Properties:
        ResourceArn:
          Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${ssm:BUYER_COGNITO_USERPOOL_ID}
        WebACLArn: ${ssm:SECURE_API_WEB_ACL_ARN, "arn:aws:wafv2:eu-west-2:123456789012:regional/webacl/dummy/dummy"}




            
plugins:
  - serverless-offline
  - serverless-package-external
  # - serverless-domain-manager
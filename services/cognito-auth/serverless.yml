service: cognito
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  http:
    cors: true
     

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
            - dynamodb:*
            - execute-api:*
          Resource: "*"
  

  environment:
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
  

    
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      


resources:
  Resources:
    AdminUsers:
      Type: "AWS::Cognito::UserPool"
      Properties:
        UserPoolName: ${self:provider.stage}-indyauction-admin
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            TemporaryPasswordValidityDays: 7
        # DeletionProtection: ACTIVE
        Schema:
          - Name: sub
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: false
            Required: true
            StringAttributeConstraints:
              MinLength: "1"
              MaxLength: "2048"
          - Name: name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: given_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: family_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: middle_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: nickname
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: preferred_username
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: profile
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: picture
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: website
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: true
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email_verified
            AttributeDataType: Boolean
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
          - Name: gender
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: birthdate
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "10"
              MaxLength: "10"
          - Name: zoneinfo
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: locale
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: phone_number
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: address
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: updated_at
            AttributeDataType: Number
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            NumberAttributeConstraints:
              MinValue: "0"
        AliasAttributes:
          - preferred_username
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate: []
        MfaConfiguration: "OFF"
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        UsernameConfiguration:
          CaseSensitive: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Priority: 1
              Name: admin_only


    AdminUsersClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        AccessTokenValidity: 1
        AllowedOAuthFlowsUserPoolClient: false
        AuthSessionValidity: 10
        ClientName: admin
        UserPoolId: { Ref: AdminUsers }
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        IdTokenValidity: 1
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 360
        TokenValidityUnits:
          AccessToken: days
          IdToken: days
          RefreshToken: days
        
    
    CognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: indyauction-admin-${self:provider.stage}
        AllowUnauthenticatedIdentities: true
        AllowClassicFlow: true
        CognitoIdentityProviders: 
          - ClientId: !Ref AdminUsersClient
            ProviderName: !GetAtt AdminUsers.ProviderName
            ServerSideTokenCheck: false
        # Define more configuration properties as needed

    CognitoIdentityPoolRole:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId:
          Ref: CognitoIdentityPool
        Roles:
          authenticated:
            Fn::GetAtt: [MyRoleLogicalName, Arn] # Replace with your IAM role
    
    MyRoleLogicalName: # Define your IAM role here
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Federated: "cognito-identity.amazonaws.com"
              Action: "sts:AssumeRoleWithWebIdentity"
              Condition:
                StringEquals:
                  "cognito-identity.amazonaws.com:aud": 
                    Ref: CognitoIdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.amazonaws.com:amr": "authenticated"

        Policies:
          - PolicyName: S3AccessPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "s3:*" # Adjust permissions as needed
                  Resource: "arn:aws:s3:::${env:S3_BUCKET}" # Replace with your S3 bucket ARN
  
   

            
plugins:
  - serverless-offline
  - serverless-package-external
  # - serverless-domain-manager
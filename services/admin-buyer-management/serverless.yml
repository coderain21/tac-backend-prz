service: admin-buyer-bid-history
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  vpc:
    securityGroupIds:
      - ${ssm:SECURITY_GROUP_ID}
    subnetIds:
      - ${ssm:SUBNET_ID}
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  layers:  ${ssm:NodeLayerARN}
  environment:
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    COGNITO_USER_POOL_ID: ${ssm:ADMIN_COGNITO_USERPOOL_ID}
    BUYER_COGNITO_USERPOOL_ID: ${ssm:BUYER_COGNITO_USERPOOL_ID}
    COGNITO_SELLER_CLIENT_ID: ${ssm:ADMIN_COGNITO_CLIENT_ID}
    SELLERS_TABLE: ${opt:stage, self:provider.stage}-users
    REGION: ${env:REGION}
    DATABASE: ${ssm:DATABASE}
    STAGE: ${opt:stage, self:provider.stage}
    MONGODB_NAME: ${opt:stage, self:provider.stage}
    MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-users
    MONGO_CLIENT: ${self:custom.mongodbConnectionString}
    LOT_COLLECTION_NAME: ${opt:stage, self:provider.stage}-bid-informations
    UNIQUE_BIDDERS_COLLECTIONS: ${opt:stage, self:provider.stage}-unique-bids
    REGISTER_AUCTION_COLLECTION: ${opt:stage, self:provider.stage}-register-auction
    BUYER_COLLECTION: ${opt:stage, self:provider.stage}-buyers
    ACCESS_LOG_COLLECTION: ${opt:stage, self:provider.stage}-access-logs
    ADMIN_USER_COLLECTION: ${opt:stage, self:provider.stage}-admin-users
    BUYER_WISHLIST_TABLE_NAME: ${opt:stage, self:provider.stage}-buyer-wishlists
    SENDER_EMAIL_ADDRESS: ${ssm:SENDER_EMAIL_ADDRESS}
    BUCKET_NAME: ${ssm:BUCKET_NAME}
    CSV_FILE:  /tmp/Auctions.csv
    S3_BUCKET: ${ssm:BUCKET_NAME}
    CDN_LINK: ${ssm:CDN_URL}
    SUMSUB_SECRET_KEY: ${ssm:SUMSUB_SECRET_KEY}
    SUMSUB_APP_TOKEN: ${ssm:SUMSUB_APP_TOKEN}
    REDIS_CLUSTER_ENDPOINT: ${ssm:REDIS_CLUSTER_ENDPOINT}
    SES_SENDER_EMAIL_ID: ${ssm:SENDER_EMAIL_ADDRESS}
    MAILCHIMP_SECRET_KEY: ${ssm:MAILCHIMP_SECRET_KEY}
    AMPLIFY_DOMAIN_NAME: ${ssm:AMPLIFY_DOMAIN_NAME}
    MAILCHIMP_ADDRESS: ${ssm:MAILCHIMP_ADDRESS}
    SOCKET_URL: ${ssm:SOCKET_URL}
    TEMPLATE_ARN_ADMIN_DELETE_BUYER: 
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-admin-delete-buyer-template/EMAIL"

    
  http:
    cors: true
    authorizers:
      cognito-auth:
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${env:REGION}.amazonaws.com/${ssm:ADMIN_COGNITO_USERPOOL_ID}
        audience: ${ssm:ADMIN_COGNITO_CLIENT_ID}


  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
          Resource: "*"
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  isProd: ${self:provider.stage} # Will be resolved at deploy time
  mongodbConnectionString: ${file(../env.yml):${self:provider.stage}.MONGODB_CONNECTION_STRING}
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  customDomain:
    rest:
      domainName: ${ssm:DOMAIN_NAME}
      stage: ${opt:stage, self:provider.stage}
      basePath: v1/${self:service}
      certificateName: ${ssm:DOMAIN_CERTIFICATE}
      createRoute53Record: true
      securityPolicy: tls_1_2
      endpointType: REGIONAL

  serverlessIfElse:
    - If: '${param:offline, "false"} == true'
      Set:
        provider.environment.MONGO_CLIENT: ${env:MONGODB_CONNECTION_STRING}



                


functions: 
  update:
    handler: handlers/accept_reject_buyers.handler
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - http:
          cors: true
          path: /admin/{buyer_id}
          method: PATCH
          authorizer:
            arn: ${ssm:ADMIN_COGNITO_AUTH_ARN}

  list-bids:
    handler: handlers/list.handler
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - http:
          cors: true
          path: /admin/buyer/{email_address}
          method: GET
          authorizer:
            arn: ${ssm:ADMIN_COGNITO_AUTH_ARN}

  list:
    handler: handlers/list_of_buyers.handler
    timeout: 30
    layers:
      -  ${ssm:NodeLayerARN}
    events:
      - http:
          cors: true
          path: /list/{seller_email}/{auction_id}
          method: GET
          authorizer:
            arn: ${ssm:ADMIN_COGNITO_AUTH_ARN}
  bids:
    handler: handlers/bid_list.list_bids
    timeout: 30
    runtime: python3.9
    layers:
    -  ${ssm:PythonLayerARN}
    vpc:
      securityGroupIds:
      - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
      - ${ssm:SUBNET_ID}
    events:
      - http:
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Requested-With
              - Accept
              - Access-Control-Allow-Headers
          path: /bids
          method: get
          authorizer:
              arn: ${ssm:ADMIN_COGNITO_AUTH_ARN}
  bid-info:
    handler: handlers/bid_info.handler
    timeout: 30
    layers:
      -  ${ssm:NodeLayerARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /admin/lots
          method: GET
          authorizer:
            arn: ${ssm:ADMIN_COGNITO_AUTH_ARN}
  delete-buyer:
    handler: handlers/delete_buyer.delete_buyer
    timeout: 30
    runtime: python3.9
    layers:
      -  ${ssm:PythonLayerARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /delete-buyer
          method: DELETE
          authorizer:
            arn: ${ssm:ADMIN_COGNITO_AUTH_ARN}

resources:
  Conditions:
    IsProd:
      Fn::Equals:
        - ${self:custom.isProd}
        - prod
  Resources:
    # WebAclAssociation: Only enabled for production stage to provide WAF protection
    # Uses CloudFormation condition 'IsProd' to create resource only for prod stage
    # SSM parameter has default value to prevent resolution errors in non-prod environments
    WebAclAssociation:
      Condition: IsProd
      Type: AWS::WAFv2::WebACLAssociation
      Properties:
        ResourceArn:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}::/restapis/${ApiGatewayRestApi}/stages/${self:provider.stage}
        WebACLArn: ${ssm:SECURE_API_WEB_ACL_ARN, "arn:aws:wafv2:eu-west-2:123456789012:regional/webacl/dummy/dummy"}

  
plugins:
  - serverless-offline
  - serverless-package-external
  - serverless-domain-manager
  - serverless-plugin-ifelse


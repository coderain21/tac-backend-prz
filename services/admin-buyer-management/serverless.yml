service: admin-buyer-bid-history
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  vpc:
    securityGroupIds:
      - sg-0882c1da39e729097
    subnetIds:
      - subnet-0ff05c7c2bd2a3f87
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${env:REGION}
  versionFunctions: false
  layers: ${env:COMMON_LIB_ARN}
  environment:
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_SELLER_CLIENT_ID: ${env:COGNITO_SELLER_CLIENT_ID}
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
    MONGODB_NAME: ${env:MONGODB_NAME}
    MONGODB_COLLECTION_NAME: ${env:MONGODB_COLLECTION_NAME}
    MONGO_CLIENT: ${env:MONGO_CLIENT}
    REGISTER_AUCTION_COLLECTION: ${opt:stage, self:provider.stage}-register-auction
    SENDER_EMAIL_ADDRESS: no-reply@indy.auction
    
  http:
    cors: true
    authorizers:
      cognito-auth:
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${env:REGION}.amazonaws.com/${env:COGNITO_USER_POOL_ID}
        audience: ${env:COGNITO_SELLER_CLIENT_ID}


  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
          Resource: "*"
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  customDomain:
    rest:
      domainName: ${env:DOMAIN_NAME}
      stage: ${opt:stage, self:provider.stage}
      basePath: ${opt:stage, self:provider.stage}/v1/${self:service}
      certificateName: ${env:DOMAIN_CERTIFICATE}
      createRoute53Record: true
      securityPolicy: tls_1_2
      endpointType: REGIONAL
                


functions: 
  update:
    handler: handlers/accept_reject_buyers.handler
    layers:
      - ${env:COMMON_LIB_ARN}
    events:
      - http:
          cors: true
          path: /{buyer_id}
          method: PATCH
          authorizer:
            arn: ${env:COGNITO_AUTH_ARN}

  list-bids:
    handler: handlers/list.handler
    layers:
      - ${env:COMMON_LIB_ARN}
    events:
      - http:
          cors: true
          path:  /admin/{email}
          method: GET
          authorizer:
            arn: ${env:COGNITO_AUTH_ARN}

  list:
    handler: handlers/list_of_buyers.handler
    layers:
      - ${env:COMMON_LIB_ARN}
    events:
      - http:
          cors: true
          path: /list/{seller_email}/{auction_id}
          method: GET
          authorizer:
            arn: ${env:COGNITO_AUTH_ARN}

  
plugins:
  - serverless-offline
  - serverless-package-external
  - serverless-domain-manager

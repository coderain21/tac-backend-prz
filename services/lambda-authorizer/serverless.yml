service: lambda-authorizer
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${env:REGION}
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${env:REGION}
    SELLER_GOOGLE_PASSWORD: ${env:SELLER_GOOGLE_PASSWORD}
    BUYER_COLLECTION: ${opt:stage, self:provider.stage}-buyers
    MONGO_CLIENT: ${ssm:MONGODB_CONNECTION_STRING}
    DATABASE: indyauction-${opt:stage, self:provider.stage}
    

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
             - lambda:*
             - execute-api:*
          Resource: "*"
                 
package:
   patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**
    - ./assets/**

custom:
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'

functions:
  lambda-authorizer:
    handler: handlers/auth.handler
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    layers:
      - ${ssm:LAMBDA_AUTH_LIB_NODE_ARN}


resources:
   Resources:
     UserPoolInvokePreAuth:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:invokeFunction
        Principal: cognito-idp.amazonaws.com
        FunctionName: arn:aws:lambda:${env:REGION}:${ssm:ACCOUNT_ID}:function:buyers-${self:provider.stage}-cognito-pre-auth
        SourceArn: arn:aws:cognito-idp:${env:REGION}:${ssm:ACCOUNT_ID}:userpool/${ssm:BUYER_COGNITO_USERPOOL_ID}


plugins:
  - serverless-package-external
  - serverless-offline
service: lambda-authorizer
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${env:REGION}
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${env:REGION}
    SELLER_GOOGLE_PASSWORD: ${env:SELLER_GOOGLE_PASSWORD}
    BUYER_COLLECTION: ${env:BUYER_COLLECTION}
    MONGO_CLIENT: ${env:MONGO_CLIENT}
    DATABASE: ${env:DATABASE}
    

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
             - lambda:*
             - execute-api:*
          Resource: "*"
                 
package:
   patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**
    - ./assets/**

custom:
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'

functions:
  lambda-authorizer:
    handler: handlers/auth.handler
    vpc:
      securityGroupIds:
        - sg-0882c1da39e729097
      subnetIds:
        - subnet-0ff05c7c2bd2a3f87
    layers:
      - ${env:LAMBDA_LAYER}


resources:
   Resources:
     UserPoolInvokePreAuth:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:invokeFunction
        Principal: cognito-idp.amazonaws.com
        FunctionName: arn:aws:lambda:${env:REGION}:${env:ACCOUNT_ID}:function:buyers-${self:provider.stage}-cognito-pre-auth
        SourceArn: arn:aws:cognito-idp:${env:REGION}:${env:ACCOUNT_ID}:userpool/${env:DEFAULT_USERPOOL_ID}


plugins:
  - serverless-package-external
  - serverless-offline
service: lambda-authorizer
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${env:REGION}
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${env:REGION}

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
             - lambda:*
             - execute-api:*
          Resource: "*"
                 
package:
  patterns:
    - '!./**'
    - '!./node_modules/**'
    - ./utils/**
    - ./handlers/**
    - ./assets/**

functions:
  lambda-authorizer:
    handler: handlers/auth.handler
    vpc:
      securityGroupIds:
        - sg-0882c1da39e729097
      subnetIds:
        - subnet-0ff05c7c2bd2a3f87
    layers:
      - ${env:LAMBDA_LAYER}

plugins:
  - serverless-package-external
  - serverless-offline
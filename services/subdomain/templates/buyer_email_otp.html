<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Otp Template For Buyer Registration</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Noto+Sans:wght@300;400;500&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;0,1000;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900;1,1000&family=Roboto:wght@100;400;500&display=swap" rel="stylesheet">
        <style>
            body{
                background: #E6E6E6;
                font-family: 'Inter', sans-serif !important;
            }
            .indy-logo{
                margin: 48px auto 0px;
                text-align: center;
                cursor: pointer;
            }
            .maincontent{
                background: #FFFFFF;
                max-width: 666px;
                height: auto;
                margin: 40px auto;
                border-radius: 10px;
                font-family: 'Inter', sans-serif !important;
            }
           
            .headersection{
                text-align: center;
                padding: 56px 0px;
                background-color: white;
                border-radius: 6px;
                font-family: 'Inter', sans-serif !important;
            }
            .heading-con{
                font-size: 22px;
                line-height: normal;
                color: #343434;
                font-style: medium;
                font-weight: 500;
                margin:0px;
                font-family: 'Inter', sans-serif !important;
            }
            .paragraph{
                font-size: 18px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#A1A1A9;
                text-align: center;
                padding:0px 132px;
                font-family: 'Inter', sans-serif !important;
            }
            .note-main{
                margin: 0px !important;
                padding: 0px;
                font-family: 'Inter', sans-serif !important;
            }
            .note-con{
                font-size: 14px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#A1A1A9;
                font-family: 'Inter', sans-serif !important;
            }
            .otp-con{
                font-size: 56px;
                font-style: normal;
                font-weight: 700;
                line-height: normal;
                margin:40px 0px 28px;
                font-family: 'Inter', sans-serif !important;
            }
            .validcode{
                font-size: 18px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#343434;
                margin-bottom: 40px;
                font-family: 'Inter', sans-serif !important;
            }
            .indy-link{
                font-size: 14px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                text-decoration-line: underline;
                color:#343434 !important;
                cursor: pointer;
                font-family: 'Inter', sans-serif !important;
            }
            .footer-con{
                margin:22px auto 0px;
                text-align: center;
                font-family: 'Inter', sans-serif !important;
            }
            .insta-icon{
                margin-right:16px;
                cursor: pointer;
                font-family: 'Inter', sans-serif !important;
            }
            .linkedin-icon{
                cursor: pointer;
            }
            .facebook-icon{
                margin-right:16px;
                cursor: pointer;
            }
            .twitter-icon{
                margin-right:16px;
                cursor: pointer;
            }
            .footer-content{
                font-size: 10px;
                font-style: normal;
                font-weight: 500;
                line-height: normal;
                color:#A1A1A9;
                font-family: 'Inter', sans-serif !important;
            }
            @media(max-width:575px){
                .headersection{
                    padding: 22px 20px 40px 20px;
                    background-color: white;
                    border-radius: 6px;
                }
                .heading-con{
                    font-size: 20px;
                }
                .paragraph{
                    font-size: 16px;
                    padding: 0px;
                }
                .otp-con{
                    margin:24px;
                    font-size: 38px;
                }
                .validcode{
                    font-size: 16px;
                    margin-bottom: 20px;
                }
                .main-content{
                    margin: 120px auto;
                }
                .note-con{
                    font-size: 13px;
                }
            }
        </style>
    </head>
    <body>
        <div class="indy-logo">
          <a href="#"><img  src={{logo_image}} alt="img" style="width: 100px; height: auto"></a> 
        </div>
        <div class="maincontent">
            <div class="headersection">
                <P class="heading-con">Thank you for joining {{seller_name}} </P>
                <p class="paragraph">Please verify your email address by using the 6-digit code below.</p>
                <p class="otp-con">{{otp}}</p>
                <p class="validcode">This code is valid for 10 minutes.</p>
                <div class="note-main">
                    <p class="note-con" style="margin-top: 25px;">If you did not register this address, please contact <a href="#" class="indy-link">support@indy.auction</a></p>
                </div>
            </div>
        </div>
    </body>
</html>

stepFunctions:
  stateMachines:
    lot-published:
      name: ${opt:stage}-lot-published
      definition:
        Comment: "Step function will trigger when lot published with sequential processing"
        StartAt: wait-for-auction-start
        States:
          wait-for-auction-start:
            Type: Wait
            TimestampPath: "$.start_date"
            Next: process-cache-lots
          process-cache-lots:
            Type: Task
            Resource:
              Fn::GetAtt: ["save-to-cache", "Arn"]
            ResultPath: "$.cache_output" # Store output for clarity
            Next: check-lot-ends
          check-lot-ends:
            Type: Wait
            TimestampPath: "$.cache_output.end_date"
            Next: wait-for-sequential-processing
          wait-for-sequential-processing:
            Type: Wait
            SecondsPath: "$.cache_output.delay_seconds" # Use delay_seconds from save-to-cache
            Next: process-cart-with-retry
          process-cart-with-retry:
            Type: Task
            Resource:
              Fn::GetAtt: ["process-cart", "Arn"]
            # InputPath: "$.cache_output.original_input" # Use original_input from save-to-cache
            Retry:
              - ErrorEquals: ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
              - ErrorEquals: ["States.TaskFailed"]
                IntervalSeconds: 5
                MaxAttempts: 2
                BackoffRate: 2.0
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: cart-processing-complete
            Next: cart-processing-complete
          cart-processing-complete:
            Type: Succeed




custom:
  isProd: ${self:provider.stage} # Will be resolved at deploy time
  mongodbConnectionString: ${file(../env.yml):${self:provider.stage}.MONGODB_CONNECTION_STRING}
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  customDomain:
    rest:
      domainName: ${ssm:DOMAIN_NAME}
      stage: ${opt:stage, self:provider.stage}
      basePath: v1/${self:service}
      certificateName: ${ssm:DOMAIN_CERTIFICATE}
      createRoute53Record: true
      securityPolicy: tls_1_2
      endpointType: REGIONAL

  serverlessIfElse:
    - If: '${param:offline, "false"} == true'
      Set:
        provider.environment.MONGO_CLIENT: ${env:MONGODB_CONNECTION_STRING}


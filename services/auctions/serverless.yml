resources:
  Conditions:
    IsProd:
      Fn::Equals:
        - ${self:custom.isProd}
        - prod
  Resources:
    LotStateMachineSSMParameter:
      Type: 'AWS::SSM::Parameter'
      Properties:
        Name: STATE_MACHINE_LOT_ARN
        Description: 'ARN of the Hello Step Functions state machine'
        Type: 'String'
        Value: !Sub
          - arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${StateMachineName}
          - StateMachineName: ${opt:stage}-lot-published
          

    

    AuctionStateMachineSSMParameter:
      Type: 'AWS::SSM::Parameter'
      Properties:
        Name: STATE_MACHINE_AUCTION_ARN
        Description: 'ARN of the Hello Step Functions state machine'
        Type: 'String'
        Value: !Sub
          - arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${StateMachineName}
          - StateMachineName: ${opt:stage}-auction-ended


    messageQueue:
      Type: "AWS::SQS::Queue"
      Properties:
        QueueName: auto-completion-email-${opt:stage, self:provider.stage}.fifo
        FifoQueue: true

    # new dlq for lot update failures
    BatchLotsUpdateDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${opt:stage, self:provider.stage}-batch-lots-update-dlq

    
    # new dlq for cleanup step functions
    CleanupStepFunctionsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${opt:stage, self:provider.stage}-cleanup-step-functions-dlq
        
    updateLotsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${opt:stage, self:provider.stage}-bulk-lots-update
        VisibilityTimeout: 180

    SQSSSMParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: SQS_QUEUE_ARN
        Type: String
        Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:auto-completion-email-${opt:stage}.fifo"


    SQSURLSSMParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: QUEUE_URL
        Type: 'String'
        Value: !Sub "https://sqs.eu-west-2.amazonaws.com/${AWS::AccountId}/auto-completion-email-${opt:stage}.fifo"


    SQSLOTUPDATESSMParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: LOT_UPDATE_QUEUE_URL
        Type: 'String'
        Value: !Sub "https://sqs.eu-west-2.amazonaws.com/${AWS::AccountId}/${opt:stage}-bulk-lots-update"

    
    # GatewayResponseDefault4XX:
    #    Type: 'AWS::ApiGateway::GatewayResponse'
    #    Properties:
    #      ResponseParameters:
    #        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    #        gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
    #      ResponseType: DEFAULT_4XX
    #      RestApiId:
    #        Ref: 'ApiGatewayRestApi'
    
    AuctionCompletion:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/send-auction-completion-email.html)}
        Subject: "Indy.auction - {{subject}}"
        TemplateName: ${self:provider.stage}-send-auction-completion-email

    # WebAclAssociation: Only enabled for production stage to provide WAF protection
    # Uses CloudFormation condition 'IsProd' to create resource only for prod stage
    # SSM parameter has default value to prevent resolution errors in non-prod environments
    WebAclAssociation:
      Condition: IsProd
      Type: AWS::WAFv2::WebACLAssociation
      Properties:
        ResourceArn:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}::/restapis/${ApiGatewayRestApi}/stages/${self:provider.stage}
        WebACLArn: ${ssm:SECURE_API_WEB_ACL_ARN, "arn:aws:wafv2:eu-west-2:123456789012:regional/webacl/dummy/dummy"}

plugins:
  - serverless-offline
  - serverless-package-external
  - serverless-domain-manager

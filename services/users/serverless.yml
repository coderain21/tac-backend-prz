        AliasAttributes:
          - preferred_username
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate: []
        MfaConfiguration: "OPTIONAL"
        EnabledMfas:
          - SOFTWARE_TOKEN_MFA
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        UsernameConfiguration:
          CaseSensitive: false
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Priority: 1
              Name: verified_email


    AdminUsersClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        AccessTokenValidity: 60
        AllowedOAuthFlowsUserPoolClient: false
        AuthSessionValidity: 10
        ClientName: admin-cooperate
        UserPoolId: { Ref: AdminUsers }
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        IdTokenValidity: 60
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
    
    CognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: arcm-${self:provider.stage}
        AllowUnauthenticatedIdentities: true
        AllowClassicFlow: true
        CognitoIdentityProviders: 
          - ClientId: !Ref AdminUsersClient
            ProviderName: !GetAtt AdminUsers.ProviderName
            ServerSideTokenCheck: false
        # Define more configuration properties as needed

    CognitoIdentityPoolRole:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId:
          Ref: CognitoIdentityPool
        Roles:
          authenticated:
            Fn::GetAtt: [MyRoleLogicalName, Arn] # Replace with your IAM role
    
    MyRoleLogicalName: # Define your IAM role here
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Federated: "cognito-identity.amazonaws.com"
              Action: "sts:AssumeRoleWithWebIdentity"
              Condition:
                StringEquals:
                  "cognito-identity.amazonaws.com:aud": 
                    Ref: CognitoIdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.amazonaws.com:amr": "authenticated"

        Policies:
          - PolicyName: S3AccessPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "s3:*" # Adjust permissions as needed
                  Resource: "arn:aws:s3:::${ssm:BUCKET_NAME}" # Replace with your S3 bucket ARN
  
    AdminCognitoIdentityPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_IDENTITY_POOL_ID
          Type: String
          Value: { Ref: CognitoIdentityPool }

    AdminCognitoPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_USERPOOL_ID
          Type: String
          Value: { Ref: AdminUsers }

    AdminCognitoPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_USERPOOL_NAME
          Type: String
          Value: arcm-${self:provider.stage}
    AdminCognitoClientIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_CLIENT_ID
          Type: String
          Value: { Ref: AdminUsersClient }
    
    AdminCognitoPoolARNStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: ADMIN_COGNITO_AUTH_ARN
          Type: String
          Value:
            Fn::GetAtt:
              - AdminUsers
              - Arn
    OTPVerification:
      Type: AWS::SES::Template
      Properties: 
        Template:
          HtmlPart: ${file(./templates/otp_email.html)}
          SubjectPart: OTP Verification for Your Account
          TemplateName: ${self:provider.stage}-otp-verification
plugins:
  - serverless-offline
  - serverless-package-external
  - serverless-domain-manager

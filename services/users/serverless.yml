resources:
  Resources:
    AdminUsers:
      Type: "AWS::Cognito::UserPool"
      Properties:
        UserPoolName: arcm-${self:provider.stage}
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            TemporaryPasswordValidityDays: 7
        DeletionProtection: ACTIVE
        Schema:
          - Name: sub
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: false
            Required: true
            StringAttributeConstraints:
              MinLength: "1"
              MaxLength: "2048"

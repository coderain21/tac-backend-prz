service: users-management
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  layers: ${ssm:COMMON_LIB_ARN}
  environment:
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    COGNITO_USER_POOL_ID: { Ref: SellerUsers }
    COGNITO_SELLER_CLIENT_ID: { Ref: SellerUsersClient } 
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
    MONGODB_NAME: ${opt:stage, self:provider.stage}
    MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-users
    MONGO_CLIENT: ${ssm:MONGODB_CONNECTION_STRING}
    CUSTOMER_SESSION_TOKEN_SECRET: ${ssm:CUSTOMER_SESSION_TOKEN_SECRET}
    RECAPTCHA_KEY: ${ssm:RECAPTCHA_KEY}
    TEMPLATE_ARN_EMAIL_OTP: 
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-email-otp-template/EMAIL"
    TEMPLATE_ARN_WELCOME_EMAIL: 
       Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-welcome_email_template/EMAIL" 
    PASSWORD_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    RECAPTCHA_URL: https://www.google.com/recaptcha/api/siteverify
    SELLERS_TABLE: ${opt:stage, self:provider.stage}-users
    SES_SENDER_EMAIL_ID: ${ssm:SENDER_EMAIL_ADDRESS}
    JWT_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    DATABASE: ${opt:stage, self:provider.stage}
    BASE_URL_SELLER: ${ssm:SELLER_APPLICATION_URL}
    FORGOT_PASSWORD_EMAIL_TEMPLATE_SELLER: ${self:provider.stage}-forgot-password
      # Fn::Join:
      #   - ":"
      #   - - "arn"
      #     - "aws"SendTemplatedEmail
      #     - "mobiletargeting"
      #     - !Ref "AWS::Region"
      #     - !Ref "AWS::AccountId"
      #     - "templates/${self:provider.stage}-forgot-password"
      #     - EMAIL
    SUMSUB_SECRET_KEY: ${ssm:SUMSUB_SECRET_KEY}
    SUMSUB_APP_TOKEN: ${ssm:SUMSUB_APP_TOKEN}
    LEVEL_NAME:  basic-kyc-level
    SUMSUB_SECRET_KEY_WEBHOOK: ${ssm:SUMSUB_SECRET_KEY_WEBHOOK}
    SELLER_GOOGLE_PASSWORD: INDY@SELLER
    DASHBOARD_URL: ${ssm:SELLER_DASHBOARD_APPLICATION_URL}
    KYB_LEVEL_NAME: basic-kyb-level
    STRIPE_API_KEY: ${ssm:STRIPE_API_KEY}
    DEFAULT_USERPOOL_ID: ${ssm:BUYER_COGNITO_USERPOOL_ID}
    DEFAULT_SUB_DOMAIN: ${ssm:DEFAULT_SUB_DOMAIN}
    DEFAULT_CLIENT_ID: ${ssm:BUYER_COGNITO_CLIENT_ID}
    REDIS_CLUSTER_ENDPOINT: ${ssm:REDIS_CLUSTER_ENDPOINT}
    
    
  http:
    cors: true
     
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
            # - lambda:RemovePermission 
          Resource: "*"
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  customDomain:
    rest:
      domainName: ${ssm:DOMAIN_NAME}
      stage: ${opt:stage, self:provider.stage}
      basePath: v1/${self:service}
      certificateName: ${ssm:DOMAIN_CERTIFICATE}
      createRoute53Record: true
      securityPolicy: tls_1_2
      endpointType: REGIONAL
  serverlessIfElse:
    - If: '${param:offline, "false"} == true'
      Set:
        provider.environment.MONGO_CLIENT: ${env:MONGODB_CONNECTION_STRING}
                
  
 


functions: 

  #COGNITO PRE SIGNUP TRIGGER
  cognito-pre-signup-trigger:
    handler: handlers/cognito_presignup.handler
    layers:
      - ${ssm:COMMON_LIB_ARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
  
    events:
        - cognitoUserPool:
            pool: ${opt:stage, self:provider.stage}-indyauction-seller
            trigger: PreSignUp
            existing: true
  
  # cognito-post-confirmations-trigger:
  #   handler: handlers/cognito_post_confirmation.handler
  #   layers:
  #     - ${ssm:COMMON_LIB_ARN}
  #   vpc:
  #     securityGroupIds:
  #       - ${ssm:SECURITY_GROUP_ID}
  #     subnetIds:
  #       - ${ssm:SUBNET_ID}
  
  #   events:
  #       - cognitoUserPool:
  #           pool: ${opt:stage, self:provider.stage}-indyauction-seller
  #           trigger: PostConfirmation
  #           existing: true
  
  cognito-post-signups-trigger:
    handler: handlers/cognito_post_confirmation.handler
    layers:
      - ${ssm:COMMON_LIB_ARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
  
    events:
        - cognitoUserPool:
            pool: ${opt:stage, self:provider.stage}-indyauction-seller
            trigger: PostConfirmation                                             #PreAuthentication
            existing: true 


  verify-recaptha:
    handler: handlers/verify_the_recaptcha.verifyReCaptcha
    layers:
      - ${ssm:COMMON_LIB_ARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          path: /verify-captcha
          method: post
          cors: true
  
  otp-validation:
    handler: handlers/otp_validation.otpValidation
    layers:
      - ${ssm:COMMON_LIB_ARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          path: /otp-validation
          method: post
          cors: true
  
  request-otp:
    handler: handlers/request-otp.generate_otp
    layers:
      - ${ssm:COMMON_LIB_ARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          path: /request-otp
          method: post
          cors: true
      
  send-reset-link:
    handler: handlers/send_reset_link.send_reset_link
    runtime: python3.9
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /forgot_password
          method: post

  update-new-password:
    handler: handlers/reset_password.password_reset
    runtime: python3.9
    layers: 
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
          securityGroupIds:
            - ${ssm:SECURITY_GROUP_ID}
          subnetIds:
            - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /reset_password
          method: post
  
  view-profile:
    handler: handlers/view_profile.view_customer
    runtime: python3.9
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
  
    events:
        - http:
            cors: true
            path: /{email}
            method: GET
            authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }



  update-profile:
        handler: handlers/update_profile.updateUserInformation
        layers:
          - ${ssm:COMMON_LIB_ARN}
        vpc:
          securityGroupIds:
            - ${ssm:SECURITY_GROUP_ID}
          subnetIds:
            - ${ssm:SUBNET_ID}
        events:
          - http:
              cors: true
              path: /{email}
              method: PATCH
              authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }

  generate_token:
    handler: handlers/generate.generate_token
    runtime: python3.9
    memorySize: 128
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /generate
          method: get
          authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }

  kyc_webhook:
    handler: handlers/kyc_webhook.kyc_webhook
    runtime: python3.9
    memorySize: 128
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /kyc
          method: post


  update-password:
        handler: handlers/update_password.updatePassword
        layers:
          - ${ssm:COMMON_LIB_ARN}
        vpc:
          securityGroupIds:
            - ${ssm:SECURITY_GROUP_ID}
          subnetIds:
            - ${ssm:SUBNET_ID}
        events:
          - http:
              cors: true
              path: /password-update/{email}
              method: PATCH
              authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }

  update-plans:
        handler: handlers/update_plan.updatePlan
        layers:
          - ${ssm:COMMON_LIB_ARN}
        vpc:
          securityGroupIds:
            - ${ssm:SECURITY_GROUP_ID}
          subnetIds:
            - ${ssm:SUBNET_ID}
        events:
          - http:
              cors: true
              path: /update-plan/{email}
              method: PATCH
              authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }
  
  kyb_generate_token:
    handler: handlers/kyb_generate.generate_token
    runtime: python3.9
    memorySize: 128
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /kyb-generate
          method: get
          authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }

  split_payment:
    handler: handlers/split_payment.splitPayment
    memorySize: 128
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /payment-intent
          method: get
          authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }
    
  seller_sub_domain:
    handler: handlers/seller_domain.create_subdomain
    runtime: python3.9
    memorySize: 128
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /seller-sub-domain
          method: post
          authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }

  disconnect_account:
    handler: handlers/stripe_disconnect.disconnect_account
    runtime: python3.9
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:
          cors: true
          path: /stripe
          method: patch
          authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }

  stripe-connect:
    handler: handlers/create.create
    runtime: python3.9
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
        - http:
            cors: true
            path: /stripe
            method: GET
            authorizer:
              type: COGNITO_USER_POOLS
              authorizerId: { Ref: MyApiGatewayAuthorizer }

  stripe-webhook:
      handler: handlers/stripe_webhook.create
      runtime: python3.9
      layers:
        - ${ssm:COMMON_LIB_ARN_PYTHON}
      vpc:
        securityGroupIds:
          - ${ssm:SECURITY_GROUP_ID}
        subnetIds:
          - ${ssm:SUBNET_ID}
    
      events:
          - http:
              cors: true
              path: /stripe_webhook_trigger
              method: any
              # authorizer:
              #   arn: ${ssm:SELLER_COGNITO_AUTH_ARN}


resources:
  Resources:
    EmailOtp:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/email_otp.html)}
        Subject: Indy.auction - OTP Verification for Your Account
        TemplateName: ${self:provider.stage}-email-otp-template
    WelcomeEmailTemplate:
      Type: AWS::Pinpoint::EmailTemplate
      Properties: 
        HtmlPart: ${file(./templates/welcome_email_template.html)}
        Subject: Welcome to Indy.auction - Your Auctioneering Partner!
        TemplateName: ${self:provider.stage}-welcome_email_template
    SellerForgotPassword:
      Type: AWS::SES::Template
      Properties: 
        Template:
          HtmlPart: ${file(./templates/seller-forgot-password.html)}
          SubjectPart: Indy auction - Password Reset Request
          TemplateName: ${self:provider.stage}-forgot-password

    SellerUsers:
      Type: "AWS::Cognito::UserPool"
      Properties:
        UserPoolName: ${self:provider.stage}-indyauction-seller
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            TemporaryPasswordValidityDays: 7
        # DeletionProtection: ACTIVE
        Schema:
          - Name: sub
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: false
            Required: true
            StringAttributeConstraints:
              MinLength: "1"
              MaxLength: "2048"
          - Name: name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: given_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: family_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: middle_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: nickname
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: preferred_username
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: profile
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: picture
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: website
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: true
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: email_verified
            AttributeDataType: Boolean
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
          - Name: gender
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: birthdate
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "10"
              MaxLength: "10"
          - Name: zoneinfo
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: locale
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: phone_number
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          # - Name: phonenumber_verified
          #   AttributeDataType: Boolean
          #   DeveloperOnlyAttribute: false
          #   Mutable: true
          #   Required: false
          - Name: address
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
              MaxLength: "2048"
          - Name: updated_at
            AttributeDataType: Number
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            NumberAttributeConstraints:
              MinValue: "0"
          - Name: email_address
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MaxLength: "2048"
          - Name: user_type
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MaxLength: "2048"
          - Name: user_name
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MaxLength: "2048"
          - Name: first_time_login
            AttributeDataType: Number
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MinLength: "0"
          # - Name: identities
          #   AttributeDataType: String
          #   DeveloperOnlyAttribute: false
          #   Mutable: true
          #   Required: false
          #   StringAttributeConstraints:
          #     MaxLength: "2048"
          - Name: is_first_time_login
            AttributeDataType: String
            DeveloperOnlyAttribute: false
            Mutable: true
            Required: false
            StringAttributeConstraints:
              MaxLength: "2048"
        AliasAttributes:
          - preferred_username
        # UsernameAttributes: 
        #   - email
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate: []
        MfaConfiguration: "OFF"
        # EnabledMfas:
        #   - SOFTWARE_TOKEN_MFA
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        UsernameConfiguration:
          CaseSensitive: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Priority: 1
              Name: admin_only

    GoogleAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          preferred_username: "email"
          username: "sub"
          email: "email"
          given_name: "given_name"
          family_name: "family_name"
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: ${ssm:GOOGLE_CLIENT_ID}
          client_secret: ${ssm:GOOGLE_CLIENT_SECRET}
          authorize_scopes: "email openid profile"
        UserPoolId: { Ref: SellerUsers }
    
    Group:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: "seller"
        UserPoolId: { Ref: SellerUsers }
                
    
    FacebookAuth:
      Type: "AWS::Cognito::UserPoolIdentityProvider"
      Properties:
        AttributeMapping:
          username: "id"
          email: "email"
          given_name: "first_name"
          family_name: "last_name"
        ProviderName: Facebook
        ProviderType: Facebook
        ProviderDetails:
          client_id: ${ssm:FACEBOOK_CLIENT_ID}
          client_secret: ${ssm:FACEBOOK_CLIENT_SECRET}
          authorize_scopes: "email"
        UserPoolId: { Ref: SellerUsers }
    
    
    
    # SellerUsersDomain:
    #   Type: "AWS::Cognito::UserPoolDomain"
    #   Properties:
    #     Domain: indyauction-seller-${self:provider.stage}
    #     UserPoolId: { Ref: SellerUsers }
 
    SellerUsersClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: 
        - GoogleAuth
        - FacebookAuth
      Properties:
        AccessTokenValidity: 5
        AllowedOAuthFlowsUserPoolClient: true
        AuthSessionValidity: 3
        ClientName: seller
        UserPoolId: { Ref: SellerUsers }
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        SupportedIdentityProviders:
          - "COGNITO"
          - "Google"
          - "Facebook"
        AllowedOAuthFlows:
          - implicit
          - code
        AllowedOAuthScopes:
          - openid
          - profile
          - email
          - aws.cognito.signin.user.admin
        CallbackURLs:
          - "${ssm:BASE_URL_SELLER}"
          - "${ssm:BASE_URL_SELLER}"
          - "http://localhost:3000/"
          - "http://localhost:3001/"
        LogoutURLs:
          - "${ssm:BASE_URL_SELLER}"
          - "http://localhost:3000/"
        IdTokenValidity: 5
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days


    CognitoIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: indyauction-seller-${self:provider.stage}
        AllowUnauthenticatedIdentities: true
        AllowClassicFlow: true
        CognitoIdentityProviders: 
          - ClientId: !Ref SellerUsersClient
            ProviderName: !GetAtt SellerUsers.ProviderName
            ServerSideTokenCheck: false
          # - ClientId: !Ref AdminUsersClient
          #   ProviderName: !GetAtt SellerUsers.ProviderName
          #   ServerSideTokenCheck: false
        # Define more configuration properties as needed
    MyApiGatewayAuthorizer: 
      Type: AWS::ApiGateway::Authorizer
      Properties: 
        Name: CognitoUserPool
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId: 
          Ref: ApiGatewayRestApi
        ProviderARNs: 
          - Fn::GetAtt:
              - SellerUsers
              - Arn
    CognitoIdentityPoolRole:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId:
          Ref: CognitoIdentityPool
        Roles:
          authenticated:
            Fn::GetAtt: [MyRoleLogicalName, Arn] # Replace with your IAM role
    
    MyRoleLogicalName: # Define your IAM role here
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Federated: "cognito-identity.amazonaws.com"
              Action: "sts:AssumeRoleWithWebIdentity"
              Condition:
                StringEquals:
                  "cognito-identity.amazonaws.com:aud": 
                    Ref: CognitoIdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.amazonaws.com:amr": "authenticated"

        Policies:
          - PolicyName: S3AccessPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "s3:PutObject" # Adjust permissions as needed
                    - "s3:GetObject"
                    - "s3:PutObjectAcl" # Adjust permissions as needed
                  Resource: "arn:aws:s3:::${ssm:BUCKET_NAME}/*" # Replace with your S3 bucket ARN
  
    SellerCognitoIdentityPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: SELLER_COGNITO_IDENTITY_POOL_ID
          Type: String
          Value: { Ref: CognitoIdentityPool }

    SellerCognitoPoolIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: SELLER_COGNITO_USERPOOL_ID
          Type: String
          Value: { Ref: SellerUsers }

    SellerCognitoPoolNameStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: SELLER_COGNITO_USERPOOL_NAME
          Type: String
          Value: indyauction-${self:provider.stage}
    SellerCognitoClientIDStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: SELLER_COGNITO_CLIENT_ID
          Type: String
          Value: { Ref: SellerUsersClient }
    
    # AdminCognitoClientIDStore:
    #     Type: AWS::SSM::Parameter
    #     Properties:
    #       Name: ADMIN_COGNITO_CLIENT_ID
    #       Type: String
    #       Value: { Ref: AdminUsersClient }
    
    SellerCognitoPoolARNStore:
        Type: AWS::SSM::Parameter
        Properties:
          Name: SELLER_COGNITO_AUTH_ARN
          Type: String
          Value:
            Fn::GetAtt:
              - SellerUsers
              - Arn         
    # SellerDomainStore:
    #     Type: AWS::SSM::Parameter
    #     Properties:
    #       Name: SELLER_COGNITO_USERPOOL_DOMAIN
    #       Type: String
    #       Value: indyauction-seller-${self:provider.stage}.auth.eu-west-2.amazoncognito.com


    BuyerUpdateCallbackLogoutURLs:
      Type: AWS::CloudFormation::CustomResource
      Properties:
        ServiceToken:  ${ssm:LAMBDA_ARN}
        UserPoolId: ${ssm:BUYER_COGNITO_USERPOOL_ID}
        ClientId: ${ssm:BUYER_COGNITO_CLIENT_ID}
        CallbackURLs:
          - "${ssm:BASE_URL_BUYER}/"
          - "${ssm:BASE_URL_BUYER}/login"
          - "${ssm:BASE_URL_BUYER}/register"
          - "http://localhost:3000/"
          - "http://localhost:3000/login"
          - "http://localhost:3000/register"
        LogoutURLs:
          - "${ssm:BASE_URL_BUYER}/"
          - "${ssm:BASE_URL_BUYER}/login"
          - "${ssm:BASE_URL_BUYER}/register"
          - "http://localhost:3000/"
          - "http://localhost:3000/login"
          - "http://localhost:3000/register"
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows:
          - implicit
          - code
        AllowedOAuthScopes:
          - openid
          - profile
          - email
          - aws.cognito.signin.user.admin
        SupportedIdentityProviders:
          - COGNITO
          - Facebook
          - Google
        AccessTokenValidity: 60
        AuthSessionValidity: 3
        EnablePropagateAdditionalUserContextData: false
        EnableTokenRevocation: true
        ExplicitAuthFlows:
          - ALLOW_CUSTOM_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        IdTokenValidity: 60
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days


    

plugins:
  - serverless-offline
  - serverless-package-external
  - serverless-domain-manager
  - serverless-plugin-ifelse




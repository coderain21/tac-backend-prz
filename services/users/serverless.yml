service: users-management
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  runtime: nodejs14.x
  stage: ${opt:stage, 'dev'}
  region: ${env:REGION}
  versionFunctions: false
  layers: ${env:COMMON_LIB_ARN}
  environment:
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_SELLER_CLIENT_ID: ${env:COGNITO_SELLER_CLIENT_ID}
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
    MONGODB_NAME: ${env:MONGODB_NAME}
    MONGODB_COLLECTION_NAME: ${env:MONGODB_COLLECTION_NAME}
    MONGO_CLIENT: ${env:MONGO_CLIENT}
    CUSTOMER_SESSION_TOKEN_SECRET: ${env:CUSTOMER_SESSION_TOKEN_SECRET}
    RECAPTCHA_KEY: ${env:RECAPTCHA_KEY}
    TEMPLATE_ARN_EMAIL_OTP: ${env:TEMPLATE_ARN_EMAIL_OTP}
    TEMPLATE_ARN_WELCOME_EMAIL: ${env:TEMPLATE_ARN_WELCOME_EMAIL}
    PASSWORD_SECRET_KEY: ${env:PASSWORD_SECRET_KEY}
    RECAPTCHA_URL: https://www.google.com/recaptcha/api/siteverify
    SELLERS_TABLE: ${env:SELLERS_TABLE}
    SES_SENDER_EMAIL_ID: ${env:SES_SENDER_EMAIL_ID}
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY}
    SENDER_EMAIL_ADDRESS: ${env:SENDER_EMAIL_ADDRESS}
    DATABASE: ${env:DATABASE}
    BASE_URL_SELLER: ${env:BASE_URL_SELLER}
    FORGOT_PASSWORD_EMAIL_TEMPLATE_SELLER: ${env:FORGOT_PASSWORD_EMAIL_TEMPLATE_SELLER}
    SUMSUB_SECRET_KEY: ${env:SUMSUB_SECRET_KEY}
    SUMSUB_APP_TOKEN: ${env:SUMSUB_APP_TOKEN}
    LEVEL_NAME: ${env:LEVEL_NAME}
    SUMSUB_SECRET_KEY_WEBHOOK: ${env:SUMSUB_SECRET_KEY_WEBHOOK}
    SELLER_GOOGLE_PASSWORD: INDY@SELLER
    DASHBOARD_URL: ${env:DASHBOARD_URL}
    KYB_LEVEL_NAME: basic-kyb-level
    YOUR_HOSTED_ZONE_ID: ${env:YOUR_HOSTED_ZONE_ID}
    STRIPE_API_KEY: ${env:STRIPE_API_KEY}
    DEFAULT_USERPOOL_ID: ${env:DEFAULT_USERPOOL_ID}
    DEFAULT_SUB_DOMAIN: ${env:DEFAULT_SUB_DOMAIN}
    DEFAULT_CLIENT_ID: ${env:DEFAULT_CLIENT_ID}
    
    
  http:
    cors: true
    authorizers:
      cognito-auth:
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${env:REGION}.amazonaws.com/${env:COGNITO_USER_POOL_ID}
        audience: ${env:COGNITO_SELLER_CLIENT_ID}


  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
          Resource: "*"
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  customDomain:
    rest:
      domainName: ${env:DOMAIN_NAME}
      stage: ${opt:stage, self:provider.stage}
      basePath: ${opt:stage, self:provider.stage}/v1/${self:service}
      certificateName: ${env:DOMAIN_CERTIFICATE}
      createRoute53Record: true
      securityPolicy: tls_1_2
      endpointType: REGIONAL
                
  
 


functions: 

# COGNITO PRE SIGNUP TRIGGER
  cognito-pre-signup-trigger:
    handler: handlers/cognito_presignup.handler
    layers:
      - ${env:COMMON_LIB_ARN}
    vpc:
      securityGroupIds:
        - sg-0882c1da39e729097
      subnetIds:
        - subnet-0ff05c7c2bd2a3f87
  
    events:
      - cognitoUserPool:
          pool: ${env:COGNITO_USER_POOL}
          trigger: PreSignUp
          existing: true
   


  # # COGNITO POST SIGNUP CONFIRMATION TRIGGER   

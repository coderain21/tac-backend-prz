service: redis-delete
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  

provider:
  name: aws
  runtime: python3.9
  endpointType: REGIONAL
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  environment:
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
    MONGODB_NAME: ${opt:stage, self:provider.stage}
    MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-users
    MONGO_CLIENT: ${self:custom.mongodbConnectionString}
    REDIS_KEYS_COLLECTION: ${opt:stage, self:provider.stage}-redis-data-keys
    PASSWORD_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    RECAPTCHA_URL: https://www.google.com/recaptcha/api/siteverify
    SELLERS_TABLE: ${opt:stage, self:provider.stage}-users
    SES_SENDER_EMAIL_ID: ${ssm:SENDER_EMAIL_ADDRESS}
    DATABASE: ${ssm:DATABASE}
    BASE_URL_SELLER: ${ssm:SELLER_APPLICATION_URL}
    SNS_TOPIC_ARN:
      Ref: RedisDeleteAlertsTopic
    REDIS_CLUSTER_ENDPOINT: ${ssm:REDIS_CLUSTER_ENDPOINT}
    AUCTION_COLLECTION: ${opt:stage, self:provider.stage}-auctions
    LOT_COLLECTION_NAME: ${opt:stage, self:provider.stage}-lots

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "sns:Publish"
          Resource: 
            Ref: RedisDeleteAlertsTopic
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - cloudwatch:GetMetricStatistics
            - cloudwatch:ListMetrics
            - logs:DescribeLogStreams
            - logs:DescribeLogGroups
          Resource: "*"

package:
  patterns:
    - '!./node_modules/**'
    - './handlers/**'
    - './data/**'
    - './entities/**'
    - './utils/**'
    - './lib/**'


custom:
  isProd: ${self:provider.stage} # Will be resolved at deploy time
  mongodbConnectionString: ${file(../env.yml):${self:provider.stage}.MONGODB_CONNECTION_STRING}
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  # customDomain:
  #   rest:
  #     domainName: ${ssm:DOMAIN_NAME}
  #     stage: ${opt:stage, self:provider.stage}
  #     basePath: v1/${self:service}
  #     certificateName: ${ssm:DOMAIN_CERTIFICATE}
  #     createRoute53Record: true
  #     securityPolicy: tls_1_2
  #     endpointType: REGIONAL
  serverlessIfElse:
    - If: '${param:offline, "false"} == true'
      Set:
        provider.environment.MONGO_CLIENT: ${env:MONGODB_CONNECTION_STRING}

resources:
  Conditions:
    IsProd:
      Fn::Equals:
        - ${self:custom.isProd}
        - prod
  Resources:
    RedisDeleteAlertsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: redis-delete-alerts
    
    RedisDeleteAlertsLambdaSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref RedisDeleteAlertsTopic
        Protocol: lambda
        Endpoint: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-api-5xx-alert-handler
    
    RedisDeleteAlertsParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: REDIS_DELETE_ALERTS_TOPIC_ARN
        Description: 'ARN of the Redis Delete Alerts SNS Topic'
        Type: 'String'
        Value: !Sub
          - arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${TopicName}
          - TopicName: redis-delete-alerts
    
    Api5xxAlertHandlerParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: API_5XX_ALERT_HANDLER_ARN
        Description: 'ARN of the API 5XX Alert Handler Lambda'
        Type: 'String'
        Value: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-api-5xx-alert-handler
    
    Api5xxAlertHandlerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-api-5xx-alert-handler
        Action: lambda:InvokeFunction
        Principal: lambda.alarms.cloudwatch.amazonaws.com
        SourceAccount: ${aws:accountId}


functions:
  delete-redis-data:
    handler: handler/handler.delete_old_redis_data  # Fixed path
    layers:
      -  ${ssm:PythonLayerARN}
      -  ${ssm:PythonLayer2ARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - schedule:
          rate: cron(0 0 * * ? *)  # Run daily at midnight UTC
          enabled: true

  api-5xx-alert-handler:
    handler: handler/api_5xx_alert_handler.lambda_handler
    timeout: 30
    environment:
      SNS_TOPIC_ARN:
        Ref: RedisDeleteAlertsTopic
      STAGE: ${opt:stage, self:provider.stage}
    layers:
      -  ${ssm:PythonLayerARN}
      -  ${ssm:PythonLayer2ARN}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}

plugins:
  - serverless-offline
  - serverless-package-external
  # - serverless-domain-manager
  - serverless-plugin-ifelse
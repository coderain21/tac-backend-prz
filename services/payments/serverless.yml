service: payments
frameworkVersion: '3'
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  - 
provider:
  name: aws
  endpointType: REGIONAL
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  layers: ${ssm:COMMON_LIB_ARN}
  apiGateway:
    methodSettings:
      - metricsEnabled: true
        loggingLevel: INFO
        dataTraceEnabled: false
        resourcePath: "/*"
        httpMethod: "*"  
  environment:
    TABLE_NAME: ${opt:stage, self:provider.stage}-${self:service}
    COGNITO_USER_POOL_ID: ${ssm:SELLER_COGNITO_USERPOOL_ID}
    COGNITO_SELLER_CLIENT_ID: ${ssm:SELLER_COGNITO_CLIENT_ID}
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
    DATABASE: ${ssm:DATABASE}
    MONGODB_NAME: ${opt:stage, self:provider.stage}
    MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-users
    MAILCHIMP_ADDRESS: ${ssm:MAILCHIMP_ADDRESS}
    MAILCHIMP_SECRET_KEY: ${ssm:MAILCHIMP_SECRET_KEY}
    MONGO_CLIENT: ${self:custom.mongodbConnectionString}
    AUCTION_MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-auctions
    COGNITO_USER_POOL: ${ssm:SELLER_COGNITO_USERPOOL_NAME}
    SELLERS_TABLE: ${opt:stage, self:provider.stage}-users
    SUMSUB_SECRET_KEY: ${ssm:SUMSUB_SECRET_KEY}
    SUMSUB_APP_TOKEN: ${ssm:SUMSUB_APP_TOKEN}
    CSV_FILE:  /tmp/Auctions.csv
    S3_BUCKET:  ${ssm:BUCKET_NAME}
    LOT_COLLECTION_NAME: ${opt:stage, self:provider.stage}-lots
    COUNTER_LOT: ${opt:stage, self:provider.stage}-counters
    REGISTER_AUCTION_COLLECTION: ${opt:stage, self:provider.stage}-register-auction
    SUB_DOMAIN_TABLE: ${opt:stage, self:provider.stage}-subdomain
    USERPOOLS_MONGO: ${opt:stage, self:provider.stage}-userpools
    #KMS_KEY_ID: ${ssm:KMS_KEY_ID}
    BUYER_EMAIL_OTP_TEMPLATE: 
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-buyer_email_otp/EMAIL"
        
    ENCRYPTION_SECRET_KEY: Indy@auction@789
    BUYER_COLLECTION: ${opt:stage, self:provider.stage}-buyers
    RECAPTCHA_KEY: ${ssm:RECAPTCHA_KEY}
    RECAPTCHA_URL: https://www.google.com/recaptcha/api/siteverify
    CUSTOMER_SESSION_TOKEN_SECRET: ${ssm:CUSTOMER_SESSION_TOKEN_SECRET}
    SES_SENDER_EMAIL_ID: ${ssm:SENDER_EMAIL_ADDRESS}
    DEFAULT_SUB_DOMAIN: ${ssm:DEFAULT_SUB_DOMAIN}    
    JWT_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    TEMPLATE_ARN_EMAIL_RESET_PASSWORD:  
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-buyer_reset_password/EMAIL"
      
   
    BASE_URL_BUYER: ${ssm:BASE_URL_BUYER}
    AMPLIFY_APP_ID: ${ssm:AMPLIFY_APP_ID}
    AMPLIFY_DOMAIN_NAME: ${ssm:AMPLIFY_DOMAIN_NAME}
    DEFAULT_INDENTITY_POOL_ID: ${ssm:BUYER_COGNITO_IDENTITY_POOL_ID}
    DEFAULT_IDENTITY_POOL_NAME: ${ssm:BUYER_COGNITO_IDENTITY_POOL_NAME}
    DEFAULT_BUYER_USERPOOL_ID: ${ssm:BUYER_COGNITO_USERPOOL_ID}
    SUBDOMAIN_COLLECTION: ${opt:stage, self:provider.stage}-subdomain
    AMPLIFY_BRANCH: ${ssm:AMPLIFY_BRANCH}
    STRIPE_API_KEY: ${ssm:STRIPE_API_KEY}
    PAYMENTS_COLLECTION: ${opt:stage, self:provider.stage}-buyers-payments
    STRIPE_ENDPOINT_SECRET: ${ssm:STRIPE_ENDPOINT_SECRET}
    ORDERS_COLLECTION: ${opt:stage, self:provider.stage}-orders
    TEMP_ORDERS_COLLECTION: ${opt:stage, self:provider.stage}-temp-orders
    ADDRESS_COLLECTION: ${opt:stage, self:provider.stage}-address-management
    CART_COLLECTION: ${opt:stage, self:provider.stage}-carts
    REDIS_CLUSTER_ENDPOINT: ${ssm:REDIS_CLUSTER_ENDPOINT}
    CDN_URL: ${ssm:CDN_URL}
    PAYPAL_CLIENT_ID: ${ssm:PAYPAL_CLIENT_ID}
    PAYPAL_CLIENT_SECRET: ${ssm:PAYPAL_CLIENT_SECRET}
    PAYPAL_OAUTH_URL: ${ssm:PAYPAL_OAUTH_URL}
    PAYPAL_PARTNER_REFERRALS_URL: ${ssm:PAYPAL_PARTNER_REFERRALS_URL}
    BASE_URL_SELLER: ${ssm:BASE_URL_SELLER}
    DASHBOARD_URL: ${ssm:SELLER_DASHBOARD_APPLICATION_URL}
    PAYPAL_WEBHOOK_ID: ${ssm:PAYPAL_WEBHOOK_ID}
    PAYPAL_REDIRECTION_PATH: ${ssm:PAYPAL_REDIRECTION_PATH}
    PAYPAL_PARTNER_MERCHANT_ID : ${ssm:PAYPAL_PARTNER_MERCHANT_ID}
    PAYPAL_URL: ${ssm:PAYPAL_URL}
    PAYMENT_STATUS: ${opt:stage, self:provider.stage}-payment-status
    


    
  http:
    cors: true
     

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
            - dynamodb:*
            - execute-api:*
            - amplify:*
            - route53:*
            - cognito-identity:UpdateIdentityPool
          Resource: "*"
 
package:
  patterns:
    - '!./node_modules/**'
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**

custom:
  isProd: ${self:provider.stage} # Will be resolved at deploy time
  mongodbConnectionString: ${file(../env.yml):${self:provider.stage}.MONGODB_CONNECTION_STRING}
  packageExternal:
    external:
      - '../../lib'
      - '../../entities'
      
  customDomain:
    rest:
      domainName: ${ssm:DOMAIN_NAME}
      stage: ${opt:stage, self:provider.stage}
      basePath: v1/${self:service}
      certificateName: ${ssm:DOMAIN_CERTIFICATE}
      createRoute53Record: true
      securityPolicy: tls_1_2
      endpointType: REGIONAL
  serverlessIfElse:
    - If: '${param:offline, "false"} == true'
      Set:
        provider.environment.MONGO_CLIENT: ${env:MONGODB_CONNECTION_STRING}

functions: 
  create_intent:
    handler: handlers/create.create_intent
    runtime: python3.9
    layers:
    - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
      - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
      - ${ssm:SUBNET_ID}
    events:
      - http:
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Requested-With
              - Accept
              - Access-Control-Allow-Headers
          path: /stripe
          method: get
          authorizer: ${ssm:BUYER_COGNITO_AUTH_ARN}       #arn:aws:lambda:${aws:region}:${aws:accountId}:function:lambda-authorizer-${self:provider.stage}-lambda-authorizer
  stripe_payments_webhook:
    handler: handlers/stripe_webhook.update
    runtime: python3.9
    layers:
    - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
      - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
      - ${ssm:SUBNET_ID}
    events:
      - http:
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Requested-With
              - Accept
              - Access-Control-Allow-Headers
          path: /payments_webhook
          method: post


resources:
  Conditions:
    IsProd:
      Fn::Equals:
        - ${self:custom.isProd}
        - prod
  Resources:
    GatewayResponseDefault4XX:
       Type: 'AWS::ApiGateway::GatewayResponse'
       Properties:
         ResponseParameters:
           gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
           gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
         ResponseType: DEFAULT_4XX
         RestApiId:
           Ref: 'ApiGatewayRestApi'
    # WebAclAssociation: Only enabled for production stage to provide WAF protection
    # Uses CloudFormation condition 'IsProd' to create resource only for prod stage
    # SSM parameter has default value to prevent resolution errors in non-prod environments
    WebAclAssociation:
      Condition: IsProd
      Type: AWS::WAFv2::WebACLAssociation
      Properties:
        ResourceArn:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}::/restapis/${ApiGatewayRestApi}/stages/${self:provider.stage}
        WebACLArn: ${ssm:SECURE_API_WEB_ACL_ARN, "arn:aws:wafv2:eu-west-2:123456789012:regional/webacl/dummy/dummy"}
    # BuyerEmailOtp:
    #   Type: AWS::Pinpoint::EmailTemplate
    #   Properties: 
    #     HtmlPart: ${file(./templates/buyer_email_otp.html)}
    #     Subject: Indy.auction - OTP Verification for Your Account
    #     TemplateName: ${self:provider.stage}-buyer_email_otp
    
    # BuyerResetPassword:
    #   Type: AWS::Pinpoint::EmailTemplate
    #   Properties: 
    #     HtmlPart: ${file(./templates/buyer_reset_password.html)}
    #     Subject: Indy.auction- Reset your password
    #     TemplateName: ${self:provider.stage}-buyer_reset_password


plugins:
  - serverless-offline
  - serverless-package-external
  - serverless-domain-manager
  - serverless-plugin-ifelse
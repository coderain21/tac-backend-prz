service: admin-management
frameworkVersion: "3"
useDotenv: true
deprecationNotificationMode: error
disabledDeprecations:
  - UNSUPPORTED_CLI_OPTIONS
  - CLI_OPTIONS_SCHEMA_V3
  - CONFIG_VALIDATION_MODE_DEFAULT_V3
  -
provider:
  name: aws
  endpointType: REGIONAL
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-2
  versionFunctions: false
  layers: ${ssm:COMMON_LIB_ARN}
  environment:
    COGNITO_USER_POOL_ID: ${ssm:ADMIN_COGNITO_USERPOOL_ID}
    COGNITO_SELLER_CLIENT_ID: ${ssm:ADMIN_COGNITO_CLIENT_ID}
    REGION: ${env:REGION}
    STAGE: ${opt:stage, self:provider.stage}
    DATABASE: ${opt:stage, self:provider.stage}
    MONGODB_NAME: ${opt:stage, self:provider.stage}
    MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-users
    MONGO_CLIENT: ${ssm:MONGODB_CONNECTION_STRING}
    AUCTION_MONGODB_COLLECTION_NAME: ${opt:stage, self:provider.stage}-auctions
    COGNITO_USER_POOL: ${ssm:ADMIN_COGNITO_USERPOOL_NAME}
    SELLERS_TABLE: ${opt:stage, self:provider.stage}-users
    ORDERS_COLLECTION: ${opt:stage, self:provider.stage}-orders
    SUMSUB_SECRET_KEY: ${ssm:SUMSUB_SECRET_KEY}
    SUMSUB_APP_TOKEN: ${ssm:SUMSUB_APP_TOKEN}
    CSV_FILE:  /tmp/Auctions.csv
    S3_BUCKET: ${ssm:BUCKET_NAME}
    LOT_COLLECTION_NAME: ${opt:stage, self:provider.stage}-lots
    SELLER_COGNITO_USERPOOL_ID: ${ssm:SELLER_COGNITO_USERPOOL_ID}
    COUNTER_LOT: ${opt:stage, self:provider.stage}-counters
    REGISTER_AUCTION_COLLECTION: ${opt:stage, self:provider.stage}-register-auction
    CREDIT_CARD_COLLECTION: ${opt:stage, self:provider.stage}-carts
    SUB_DOMAIN_TABLE: ${opt:stage, self:provider.stage}-subdomain
    USERPOOLS_MONGO: ${opt:stage, self:provider.stage}-userpools
    STEP_FUNCTION_COLLECTION: ${opt:stage, self:provider.stage}-step-function-arns
    #KMS_KEY_ID: ${ssm:KMS_KEY_ID}
    SALES_CSV_FILE:  /tmp/Sales_List.csv

    # BUYER_EMAIL_OTP_TEMPLATE:
    #   Fn::Join:
    #     - ":"
    #     - - "arn"
    #       - "aws"
    #       - "mobiletargeting"
    #       - !Ref "AWS::Region"
    #       - !Ref "AWS::AccountId"
    #       - "templates/${self:provider.stage}-buyer_email_otp/EMAIL"

    ENCRYPTION_SECRET_KEY: Indy@auction@789
    BUYER_COLLECTION: ${opt:stage, self:provider.stage}-buyers
    RECAPTCHA_KEY: ${ssm:RECAPTCHA_KEY}
    RECAPTCHA_URL: https://www.google.com/recaptcha/api/siteverify
    CUSTOMER_SESSION_TOKEN_SECRET: ${ssm:CUSTOMER_SESSION_TOKEN_SECRET}
    SES_SENDER_EMAIL_ID: ${ssm:SENDER_EMAIL_ADDRESS}
    DEFAULT_SUB_DOMAIN: ${ssm:DEFAULT_SUB_DOMAIN}
    JWT_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    TEMPLATE_ARN_ADMIN_UPDATE_PASSWORD: 
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-admin-update-password-template/EMAIL"

    TEMPLATE_ARN_ADMIN_ACTIVATE_SELLER: 
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "mobiletargeting"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "templates/${self:provider.stage}-admin-activate-seller-template/EMAIL"

    BASE_URL_BUYER: ${ssm:BASE_URL_BUYER}
    CDN_LINK: ${ssm:CDN_URL}
    STRIPE_API_KEY: ${ssm:STRIPE_API_KEY}
    SELLER_GOOGLE_PASSWORD: INDY@SELLER
    PASSWORD_SECRET_KEY: ${ssm:PASSWORD_SECRET_KEY}
    ADDRESS_COLLECTION: ${opt:stage, self:provider.stage}-address-management
    SUBDOMAIN_COLLECTION: ${opt:stage, self:provider.stage}-subdomain
    COGNITO_ADMIN_AUTH_ARN: ${ssm:SELLER_COGNITO_AUTH_ARN}
    ADMIN_COGNITO_AUTH_ARN: ${ssm:ADMIN_COGNITO_AUTH_ARN}
    ADMIN_COGNITO_CLIENT_ID: ${ssm:ADMIN_COGNITO_CLIENT_ID}
    COGNITO_ADMIN_USER_POOL_ID: ${ssm:ADMIN_COGNITO_USERPOOL_ID}
    ADMIN_COGNITO_USERPOOL_ID: ${ssm:ADMIN_COGNITO_USERPOOL_ID}
    # REDIS_CLUSTER_ENDPOINT: ${ssm:REDIS_CLUSTER_ENDPOINT}

    SQS_QUEUE_ARN:  
      Fn::Join:
        - ":"
        - - "arn"
          - "aws"
          - "sqs"
          - !Ref "AWS::Region"
          - !Ref "AWS::AccountId"
          - "auto-completion-email-${self:provider.stage}.fifo"
    BIDINFORMATIONTABLE: ${opt:stage, self:provider.stage}-bid-informations
    SQS_QUEUE_NAME: auto-completion-email-${opt:stage, self:provider.stage}.fifo
    UNIQUE_BIDDERS_COLLECTIONS: ${opt:stage, self:provider.stage}-unique-bids
    COMMON_LIB_ARN_PYTHON_2: ${ssm:COMMON_LIB_ARN_PYTHON_2}
    STEP_FUNCTION_ARN_TABLE: ${opt:stage, self:provider.stage}-step-function-arns
    REDIS_CLUSTER_ENDPOINT: ${ssm:REDIS_CLUSTER_ENDPOINT}
    SOCKET_URL: ${ssm:SOCKET_URL}
    # TEMPLATE_ARN_AUCTION_COMPLETION:
    #   Fn::Join:
    #     - ":"
    #     - - "arn"
    #       - "aws"
    #       - "mobiletargeting"
    #       - !Ref "AWS::Region"
    #       - !Ref "AWS::AccountId"
    #       - "templates/${self:provider.stage}-send-auction-completion-email/EMAIL"
    S3_BUCKET_URL: ${ssm:CDN_URL}
    SENDER_EMAIL: ${ssm:SENDER_EMAIL_ADDRESS}
    STATE_MACHINE_LOT_ARN:  
      Fn::Join:
          - ":"
          - - "arn"
            - "aws"
            - "states"
            - !Ref "AWS::Region"
            - !Ref "AWS::AccountId"
            - "stateMachine:${opt:stage}-lot-published"
    STATE_MACHINE_DEACTIVATE_SELLER_ARN:  
      Fn::Join:
          - ":"
          - - "arn"
            - "aws"
            - "states"
            - !Ref "AWS::Region"
            - !Ref "AWS::AccountId"
            - "stateMachine:${opt:stage}-seller-deactivate"
    STATE_MACHINE_AUCTION_ARN: 
      Fn::Join:
          - ":"
          - - "arn"
            - "aws"
            - "states"
            - !Ref "AWS::Region"
            - !Ref "AWS::AccountId"
            - "stateMachine:${opt:stage}-auction-ended"
    QUEUE_URL: 
      Fn::Join:
          - "/"
          - - "https:/"
            - "sqs.eu-west-2.amazonaws.com"
            - !Ref "AWS::AccountId"
            - "auto-completion-email-${opt:stage}.fifo"
    LOT_UPDATE_QUEUE_URL: 
      Fn::Join:
          - "/"
          - - "https:/"
            - "sqs.eu-west-2.amazonaws.com"
            - !Ref "AWS::AccountId"
            - "${opt:stage}-bulk-lots-update"

  http:
    cors: true
    authorizers:
      cognito-auth:
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${env:REGION}.amazonaws.com/${ssm:ADMIN_COGNITO_USERPOOL_ID}
        audience: ${ssm:ADMIN_COGNITO_CLIENT_ID}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:*
            - ses:*
            - s3:*
            - lambda:*
            - mobiletargeting:*
            - dynamodb:*
            - execute-api:*
            - states:*
            - sqs:*
            - sts:*
          Resource: "*"

package:
  patterns:
    - "!./node_modules/**"
    - ./handlers/**
    - ./data/**
    - ./entities/**
    - ./utils/**
    - ./lib/**


custom:
  packageExternal:
    external:
      - "../../lib"
      - "../../entities"

  customDomain:
    rest:
      domainName: ${ssm:DOMAIN_NAME}
      stage: ${opt:stage, self:provider.stage}
      basePath: v1/${self:service}
      certificateName: ${ssm:DOMAIN_CERTIFICATE}
      createRoute53Record: true
      securityPolicy: tls_1_2
      endpointType: REGIONAL

  serverlessIfElse:
    - If: '${param:offline, "false"} == true'
      Set:
        provider.environment.MONGO_CLIENT: ${env:MONGODB_CONNECTION_STRING}

stepFunctions:
  stateMachines:
    seller-deactivate:
      name: ${opt:stage}-seller-deactivate
      definition:
        Comment: "Step function will trigger when seller is deactivated"
        StartAt: manage-seller-deactivation
        States:
          manage-seller-deactivation:
            Type: Task
            Resource:
              Fn::GetAtt: ["manage-seller-deactivation", Arn]
            End: true
functions:
  list-auction:
    handler: handlers/list_auction.list_auction
    runtime: python3.8
    layers:
      - ${ssm:COMMON_LIB_ARN_PYTHON}
    vpc:
      securityGroupIds:
        - ${ssm:SECURITY_GROUP_ID}
      subnetIds:
        - ${ssm:SUBNET_ID}
    events:
      - http:

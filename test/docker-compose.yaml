version: '3.1'

services:
  documentdb:
    image: mongo:5.0  # Use 4.0 or 3.6 if your DocumentDB cluster is older
    container_name: local-documentdb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TDD_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${TDD_MONGO_PASSWORD} 
    volumes:
      - documentdb_data:/data/db
    env_file:
      - ./.env

volumes:
  documentdb_data:

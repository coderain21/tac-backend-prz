- stage: Build
  jobs:
    - job: "Download_Environment"
      displayName: "Build"
      pool:
        vmImage: "ubuntu-latest"
      steps:
        - script: |
            ./envs.sh
          displayName: 'Copy Environment Files'
        - publish: $(System.DefaultWorkingDirectory)/.env
          artifact: Environment
  

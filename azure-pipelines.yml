trigger:
  branches:
    include:
      - qa
      - pre-prod
      - master
      - bidding-engine
      - qa-tac
pr:
  branches:
    include:
      - qa
      - qa-tac
variables:
  - group: general
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
    - group: master
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/qa') }}:
    - group: qa
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/qa-tac') }}:
    - group: qa
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/pre-prod') }}:
    - group: pre-production
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/bidding-engine') }}:
    - group: bidding-engine
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - group: develop



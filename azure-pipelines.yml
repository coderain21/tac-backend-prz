    #       displayName:  Unit Testing Documentation
  
    - job: "dast"
      displayName: 'Dynamic Application Security Testing (DAST)'
      # dependsOn: APITesting
      condition: and(or(contains(variables['build.SourceBranch'], 'feature'), contains(variables['build.SourceBranch'], 'bugfix'), contains(variables['build.SourceBranch'], 'hotfix')), succeeded())
      pool:
          vmImage: "ubuntu-latest"
      steps:
        - checkout: self
          clean: true
          fetchDepth: 0
          persistCredentials: true
        - task: DownloadPipelineArtifact@2
          name: environment
          inputs:
            artifact: Environment
            targetPath: '$(System.DefaultWorkingDirectory)'
        - script: |
              git config --global user.email $BITBUCKET_EMAIL
              git config --global user.name $BITBUCKET_USER
              git config --global advice.detachedHead false
              docker run -u zap -p 8080:8080 -d softwaresecurityproject/zap-stable zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
              cd $(System.DefaultWorkingDirectory)
              export $(grep -v '^#' .env | xargs)
              source .env
              # Print environment variables to verify they are set correctly
              pip3 install gitpython
              pip3 install boto3
              pip3 install botocore
              mkdir test_results
              git fetch --unshallow
              sourceBranchFullName=$(Build.SourceBranch)
              branchName=${sourceBranchFullName#refs/heads/}
              echo $branchName
              python3 dast.py $branchName
              chmod 777 /zap/wrk/test_results/report.html
              if [ $? -ne 0 ]; then
                echo "DAST failed"
                exit 1
              fi
          displayName: 'Dynamic Application Security Testing (DAST)'
        - publish: $(System.DefaultWorkingDirectory)/test_results/report0.html # Assuming logs are in working directory
          artifact: dast_test_results
          condition: always()
    
